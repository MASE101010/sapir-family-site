name: ספריית הסרטונים
on:
  schedule:
    - cron: "17 */6 * * *"   # כל 6 שעות
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: library, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -U yt-dlp
      - name: בניית הספרייה מכל הערוצים
        run: python3 scripts/build_library.py 2>&1 | tee data/library.log
      - name: שמירה לריפו
        run: |
          git config user.name "sapir-library-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/library.json data/library.log
          git diff --cached --quiet || git commit -m "ספרייה: עדכון סרטונים $(date -u +%Y-%m-%dT%H:%M)"
          git push
