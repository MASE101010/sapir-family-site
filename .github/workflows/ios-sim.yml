name: אפליקציית אייפון, צילום בסימולטור
on:
  workflow_dispatch:
jobs:
  sim:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1); sudo xcode-select -s "$X"; echo "$X"
      - run: brew install xcodegen >/dev/null 2>&1 || true
      - name: בנייה לסימולטור
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project SapirFamily.xcodeproj -scheme SapirFamily -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet build
      - name: הרצה וצילומים
        timeout-minutes: 12
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 17 Pro') or x['name'].startswith('iPhone 16 Pro')))")
          echo "device $DEV"; xcrun simctl boot "$DEV"; sleep 45; echo booted
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/*.app | head -1)
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl privacy "$DEV" grant all il.co.sapirfamily.app || true
          xcrun simctl launch "$DEV" il.co.sapirfamily.app & sleep 5; echo launched
          mkdir -p shots
          for t in 8 25 45 70; do sleep $((t - ${PREV:-0})); PREV=$t; xcrun simctl io "$DEV" screenshot "shots/t$t.png"; echo "shot $t"; done
          xcrun simctl spawn "$DEV" log show --last 3m --predicate 'process == "SapirFamily"' 2>/dev/null | grep -iE "ads|banner|GAD|error" | tail -40 > shots/log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sim-shots, path: shots/*, retention-days: 3 }
