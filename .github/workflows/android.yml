name: אפליקציית טלוויזיה (Android TV)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "מספר גרסה (למשל 1.0)"
        default: "1.0"
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
concurrency: { group: android, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: מפתח החתימה (מהסוד ANDROID_KEYSTORE_B64)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/sapir.jks"; echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sapir.jks" >> "$GITHUB_ENV"; echo "signed=yes";
          else echo "::warning::אין סוד ANDROID_KEYSTORE_B64, הקובץ ייבנה בלי חתימה (לא ניתן להעלות לחנות)"; fi
      - name: בנייה
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease
      - name: שמות קבצים
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab out/sapir-family-tv.aab
          cp android/app/build/outputs/apk/release/app-release*.apk out/sapir-family-tv.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: sapir-family-android, path: out/* }
      - name: פרסום ב-Release קבוע (android-latest)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "אפליקציית משפחת ספיר (Android TV)" --notes "הקובץ האחרון שנבנה. AAB לחנות, APK להתקנה ידנית בטלוויזיה."
          gh release upload android-latest out/sapir-family-tv.aab out/sapir-family-tv.apk --clobber
