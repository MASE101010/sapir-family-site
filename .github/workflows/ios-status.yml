name: סטטוס האפליקציה ב-App Store
on: { workflow_dispatch: {} }
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m pip install -q cryptography
      - env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || '8232HH4552' }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || '1702e21a-d07f-49a7-9c39-40d65aea7f65' }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: python3 ios/tools/asc.py status il.co.sapirfamily.app
