name: אפליקציית אייפון (App Store)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "מספר גרסה (למשל 1.0)"
        default: "1.0"
      upload:
        description: "להעלות ל-App Store Connect (TestFlight) אחרי הבנייה"
        type: boolean
        default: true
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
permissions:
  contents: write
concurrency: { group: ios, cancel-in-progress: true }
env:
  ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || '8232HH4552' }}
  ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || '1702e21a-d07f-49a7-9c39-40d65aea7f65' }}
  BUNDLE_ID: il.co.sapirfamily.app
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: XcodeGen
        run: brew install xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: מפתח App Store Connect (מהסוד APPSTORE_KEY_P8)
        env: { P8: "${{ secrets.APPSTORE_KEY_P8 }}" }
        run: |
          if [ -z "$P8" ]; then echo "::error::חסר הסוד APPSTORE_KEY_P8 (תוכן הקובץ AuthKey_$ASC_KEY_ID.p8)"; exit 1; fi
          mkdir -p ~/private_keys
          printf '%s\n' "$P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          python3 -m pip install -q cryptography
      - name: מזהה הצוות ורישום ה-Bundle ID
        env:
          ASC_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$TEAM" ]; then TEAM=$(python3 ios/tools/asc.py team); fi
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"; echo "team $TEAM"
          python3 ios/tools/asc.py ensure-bundle "$BUNDLE_ID" "Sapir Family"
          APP=$(python3 ios/tools/asc.py app "$BUNDLE_ID"); echo "ASC_APP_ID=$APP" >> "$GITHUB_ENV"
          if [ -z "$APP" ]; then echo "::warning::אין עדיין אפליקציה ב-App Store Connect עם $BUNDLE_ID, ההעלאה תידלג. יוצרים אותה פעם אחת ב-appstoreconnect.apple.com → My Apps → +"; fi
      - name: יצירת הפרויקט
        working-directory: ios
        run: xcodegen generate
      - name: ארכיון
        working-directory: ios
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0' }}
        run: |
          xcodebuild -project SapirFamily.xcodeproj -scheme SapirFamily -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SapirFamily.xcarchive" archive \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" -quiet
          test -d "$RUNNER_TEMP/SapirFamily.xcarchive" || { echo "::error::הארכיון לא נוצר"; exit 1; }
      - name: ייצוא IPA
        working-directory: ios
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SapirFamily.xcarchive" -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          mkdir -p ../out && cp "$RUNNER_TEMP"/out/*.ipa ../out/sapir-family-ios.ipa && ls -la ../out
      - uses: actions/upload-artifact@v4
        with: { name: sapir-family-ios, path: out/* }
      - name: העלאה ל-App Store Connect
        if: ${{ env.ASC_APP_ID != '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.upload == 'true') }}
        run: |
          xcrun altool --upload-app -f out/sapir-family-ios.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: פרסום ב-Release קבוע (ios-latest)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --title "אפליקציית משפחת ספיר (iPhone/iPad)" --notes "ה-IPA האחרון שנבנה, חתום לחנות (לא להתקנה ידנית)."
          gh release upload ios-latest out/sapir-family-ios.ipa --clobber
