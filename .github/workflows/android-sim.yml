name: אפליקציית אנדרואיד, בדיקה באמולטור
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: הורדת ה-APK האחרון
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download android-latest -p sapir-family-tv.apk -D apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p shots
            adb install -r apk/sapir-family-tv.apk
            adb logcat -c
            adb shell monkey -p il.co.sapirfamily.app -c android.intent.category.LAUNCHER 1
            sleep 20; adb exec-out screencap -p > shots/a20.png
            sleep 50; adb exec-out screencap -p > shots/a70.png
            adb logcat -d | grep -E "AndroidRuntime|FATAL|il.co.sapirfamily|Ads" | tail -60 > shots/log.txt || true
            adb shell pidof il.co.sapirfamily.app > shots/pid.txt || echo dead > shots/pid.txt
      - name: שמירת הצילומים
        if: always()
        run: |
          git config user.name sapir-ci; git config user.email ci@sapirfamily.co.il
          git checkout --orphan android-shots-tmp && git rm -rq --cached . && git add -f shots && git commit -qm "android shots" && git push -fq origin HEAD:android-shots
