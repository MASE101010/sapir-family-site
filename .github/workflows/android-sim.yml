name: אפליקציית אנדרואיד TV, בדיקה באמולטור טלוויזיה
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: הורדת ה-APK האחרון
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download android-latest -p sapir-family-tv.apk -D apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/tv-test.sh
      - name: שמירת הצילומים
        if: always()
        run: |
          git config user.name sapir-ci; git config user.email ci@sapirfamily.co.il
          git checkout --orphan android-shots-tmp && git rm -rq --cached . && git add -f shots && git commit -qm "tv shots" && git push -fq origin HEAD:android-shots
