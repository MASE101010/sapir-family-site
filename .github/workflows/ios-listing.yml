name: דף האפליקציה ב-App Store (טקסטים, צילומי מסך, שליחה)
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "לשלוח לביקורת של אפל אחרי המילוי"
        type: boolean
        default: false
      screenshots:
        description: "להעלות צילומי מסך מחדש"
        type: boolean
        default: true
      require_build:
        description: "לעצור אם הבילד הזה עוד לא מוכן (מספר בילד, רשות)"
        default: ""
jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m pip install -q cryptography
      - name: מילוי דף האפליקציה
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || '8232HH4552' }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || '1702e21a-d07f-49a7-9c39-40d65aea7f65' }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
          ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
          REQUIRE_BUILD: ${{ github.event.inputs.require_build }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.submit }}" = "true" ] && ARGS="$ARGS --submit"
          [ "${{ github.event.inputs.screenshots }}" = "false" ] && ARGS="$ARGS --no-screenshots"
          python3 ios/tools/asc_listing.py $ARGS
