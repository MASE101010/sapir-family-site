<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>פלישת הוירוסים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one portrait play column (9:16 on desktop, full screen on phones); canvas underneath, DOM screens stacked above it */
:root{
  --void:#06051a; --deep:#140d3c; --ink:#f1f0ff; --dim:#a3a2d0; --faint:rgba(170,160,255,.16);
  --virus:#ff2d78; --virus-d:#8a0b44; --toxic:#b6ff3b; --gold:#ffb21e; --gold-d:#ff6a00; --cyan:#3fe6ff;
  --panel:rgba(20,14,58,.82); --line:rgba(170,160,255,.24);
  --f-display:'Karantina','Fredoka',system-ui,sans-serif;
  --f-body:'Fredoka','Rubik','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f-body);font-size:15px}
#wrap{position:fixed;inset:0;display:flex;justify-content:center;background:radial-gradient(ellipse at 50% 20%,#1d1258 0%,var(--void) 65%)}
#stage{position:relative;height:100%;overflow:hidden;background:var(--void);box-shadow:0 0 90px rgba(120,70,255,.28)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
svg{width:1em;height:1em;fill:currentColor;flex:none}

.screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;
  padding:calc(env(safe-area-inset-top,0px) + 26px) 28px calc(env(safe-area-inset-bottom,0px) + 28px);gap:12px}
.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box;background:rgba(4,3,18,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.card{width:100%;max-width:360px;background:linear-gradient(170deg,rgba(40,26,104,.95),rgba(14,10,44,.97));border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.card h2{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.95;margin:0;letter-spacing:.5px;text-wrap:balance}
.card p{margin:0;color:var(--dim);line-height:1.45}

.btn{--c1:#3a2c8a;--c2:#251a63;--tx:var(--ink);position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;
  font-weight:600;font-size:18px;color:var(--tx);background:linear-gradient(180deg,var(--c1),var(--c2));
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);
  transition:transform .12s, filter .12s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.12)}
.btn.gold{--c1:#ffd257;--c2:#ff8a00;--tx:#2a1200;font-size:22px;min-height:60px}
.btn.virus{--c1:#ff4f95;--c2:#b3125a}
.btn.cyan{--c1:#47e9ff;--c2:#1386c9;--tx:#04202c}
.btn.ghost{--c1:rgba(80,64,170,.45);--c2:rgba(40,30,100,.45)}
.btn[disabled]{filter:grayscale(.8) brightness(.6);pointer-events:none}
.iconbtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(40,30,110,.6);border:1px solid var(--line)}

/* Menu */
#menu{justify-content:space-between}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center}
.logo{text-align:center;margin-top:0;position:relative;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.logo .l1{font-family:var(--f-display);font-size:46px;line-height:.8;color:var(--gold);letter-spacing:2px;text-shadow:0 0 18px rgba(255,170,30,.5)}
.logo .l2{font-family:var(--f-display);font-weight:700;font-size:96px;line-height:.82;color:#fff;position:relative;
  text-shadow:0 0 2px #fff,0 0 22px rgba(255,45,120,.9),0 0 60px rgba(255,45,120,.5)}
.logo .l2::before,.logo .l2::after{content:attr(data-t);position:absolute;inset:0;mix-blend-mode:screen;opacity:0;animation:glitch 4.2s infinite steps(1)}
.logo .l2::before{color:#ff2d78;transform:translate(-3px,0)}
.logo .l2::after{color:#3fe6ff;transform:translate(3px,0);animation-delay:.08s}
@keyframes glitch{0%,90%,100%{opacity:0}91%{opacity:.9;clip-path:inset(20% 0 55% 0)}93%{opacity:.9;clip-path:inset(60% 0 10% 0)}95%{opacity:.8;clip-path:inset(5% 0 80% 0)}97%{opacity:0}}
.logo .tag{margin-top:12px;padding:7px 16px;border-radius:999px;background:rgba(8,5,30,.82);border:1px solid rgba(255,178,30,.45);
  color:#fff3d6;font-weight:600;font-size:15px;letter-spacing:.2px;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.menu-btns{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.best{color:var(--dim);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.packbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-radius:14px;
  background:linear-gradient(100deg,rgba(255,45,120,.25),rgba(255,178,30,.18));border:1px solid rgba(255,120,160,.45);text-align:start}
.packbtn b{display:block;font-size:17px}
.packbtn span{font-size:12px;color:#ffd6e6}
.packbtn .price{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--gold);line-height:1;white-space:nowrap}

.hdr{width:100%;display:flex;align-items:center;gap:12px}
.hdr h1{font-family:var(--f-display);font-weight:700;font-size:48px;margin:0;line-height:1;flex:1}

/* Hangar */
#prev{width:100%;max-width:380px;aspect-ratio:1/0.82;flex:none;position:relative}
#prevC{width:100%;height:100%;display:block}
.navarrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;display:grid;place-items:center;font-size:26px;background:rgba(40,30,110,.55);border:1px solid var(--line);border-radius:12px}
.navarrow.l{inset-inline-start:0}.navarrow.r{inset-inline-end:0}
[dir=rtl] .navarrow svg{transform:scaleX(-1)}
.shipname{font-family:var(--f-display);font-weight:700;font-size:52px;line-height:.9;margin:0;text-align:center}
.spbox{width:100%;max-width:360px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-sizing:border-box}
.spbox b{color:var(--gold);font-size:16px;display:flex;gap:6px;align-items:center}
.spbox p{margin:4px 0 0;color:var(--dim);font-size:14px;line-height:1.4}
.stats{width:100%;max-width:360px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:13px;color:var(--dim)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),#9b7bff)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.dots i.lock{background:rgba(255,255,255,.1);outline:1px solid rgba(255,255,255,.2)}
.hangar-actions{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px;margin-top:6px}
#hangar>*{transition:opacity .35s}
#hangar.launching>*{opacity:0;pointer-events:none}
#flashFx{position:absolute;inset:0;z-index:40;background:#fff;pointer-events:none;opacity:0}
#flashFx.on{animation:flashA 1s ease-out forwards}
@keyframes flashA{0%{opacity:1}100%{opacity:0}}
/* Galaxy level map */
.gmap{position:relative;width:100%;border-radius:18px;overflow:hidden;
  background-color:#05041a;
  background-image:radial-gradient(1.2px 1.2px at 23px 41px,#fff,transparent),radial-gradient(1px 1px at 120px 90px,rgba(255,255,255,.8),transparent),radial-gradient(1.5px 1.5px at 170px 15px,#cfe8ff,transparent),radial-gradient(1px 1px at 70px 150px,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 190px 170px,#fff,transparent),radial-gradient(1.3px 1.3px at 40px 190px,rgba(255,220,255,.8),transparent);
  background-size:210px 210px;border:1px solid var(--line)}
.gzone{position:absolute;left:0;right:0;pointer-events:none}
.gpath{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.gplanet{position:absolute;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 0 18px rgba(0,0,0,.6))}
.gpname{position:absolute;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap}
.gpname small{display:block;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.4px}
.gpname b{display:block;font-family:var(--f-display);font-size:34px;line-height:.95;text-shadow:0 0 16px var(--pc),0 2px 6px #000}
.gn{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;
  background:radial-gradient(circle at 35% 30%,#4a3fa8,#1d1660);border:2px solid rgba(170,160,255,.5);box-shadow:0 3px 10px rgba(0,0,0,.5)}
.gn.done{background:radial-gradient(circle at 35% 30%,#4af0ff,#0d6a9a);border-color:#a8f6ff;color:#032030}
.gn.boss{width:46px;height:46px;margin:-23px 0 0 -23px;border-color:#ff4f95;box-shadow:0 0 12px rgba(255,45,120,.6)}
.gn.big{width:54px;height:54px;margin:-27px 0 0 -27px;background:radial-gradient(circle at 35% 30%,#ff6aa8,#7a0a3c);border:3px solid #ffc23a;color:#fff;box-shadow:0 0 18px rgba(255,45,120,.8)}
.gn.big svg{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:22px;height:16px;color:#ffc23a;filter:drop-shadow(0 1px 2px #000)}
.gn.lock{filter:grayscale(.9) brightness(.45);pointer-events:none}
.gn.cur{background:radial-gradient(circle at 35% 30%,#ffe27a,#ff8a00);border-color:#fff;color:#2a1200;animation:curP 1.2s infinite}
@keyframes curP{50%{box-shadow:0 0 0 8px rgba(255,190,40,.25),0 0 26px rgba(255,170,30,.9)}}
.gship{position:absolute;width:46px;height:46px;transform:translate(-50%,-115%);pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,200,80,.6))}
/* Leaderboard */
.board-list{width:100%;max-width:400px;flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.brow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.brow .rk{font-family:var(--f-display);font-size:28px;font-weight:700;text-align:center;line-height:1;color:var(--dim)}
.brow:nth-child(1) .rk{color:#ffd257}.brow:nth-child(2) .rk{color:#d8e0f0}.brow:nth-child(3) .rk{color:#ff9a5a}
.brow .nm{min-width:0}.brow .nm b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .nm span{font-size:12px;color:var(--dim)}
.brow .sc{font-weight:700;font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
.brow.me{border-color:var(--gold);background:linear-gradient(100deg,rgba(255,178,30,.18),var(--panel))}
.board-note{color:var(--dim);font-size:12px;text-align:center}
.board-empty{color:var(--dim);text-align:center;padding:40px 10px}
.namein{width:100%;box-sizing:border-box;height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(8,5,30,.7);color:var(--ink);font:600 19px var(--f-body);text-align:center;padding:0 12px}
.namein:focus{outline:2px solid var(--gold)}
.nameerr{color:#ff8aa8;font-size:13px;min-height:18px}
.topleft{display:flex;gap:10px}

/* Levels */
.levels-scroll{width:100%;flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;padding-bottom:10px;border-radius:18px}
.chap{padding:12px;border-radius:16px;background:rgba(14,10,44,.55);border:1px solid var(--line)}
.chap h3{margin:0 0 10px;font-weight:600;font-size:14px;color:var(--dim);display:flex;align-items:center;gap:10px}
.chap h3 .pdot{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:0 0 12px var(--pc)}
.chap h3 b{color:var(--ink);font-size:18px;display:block}
.chap h3 .rng{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;
  background:rgba(60,46,150,.35);border:1px solid var(--line);position:relative}
.lv.done{background:linear-gradient(160deg,rgba(63,230,255,.25),rgba(40,30,110,.5));border-color:rgba(63,230,255,.4)}
.lv.cur{background:linear-gradient(160deg,#ffd257,#ff8a00);color:#2a1200;border:0;box-shadow:0 0 18px rgba(255,170,30,.55)}
.lv.lock{opacity:.38;pointer-events:none}
.lv.boss::after{content:'';position:absolute;top:4px;inset-inline-end:4px;width:8px;height:8px;border-radius:50%;background:var(--virus);box-shadow:0 0 6px var(--virus)}
.lv.big{background:linear-gradient(160deg,rgba(255,45,120,.55),rgba(90,10,50,.6));border-color:rgba(255,45,120,.7)}
.lv.big.lock{opacity:.5}
.lv.big.cur{background:linear-gradient(160deg,#ffd257,#ff2d78)}
.lvnote{color:var(--dim);font-size:12px;text-align:center}

/* Settings */
.setlist{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:17px}
.toggle{min-width:84px;height:38px;border-radius:19px;background:rgba(255,255,255,.1);font-weight:600;font-size:15px}
.toggle.on{background:linear-gradient(180deg,#47e9ff,#1386c9);color:#04202c}
.legal{color:var(--dim);font-size:12px;text-align:center;line-height:1.5;margin-top:auto}

/* HUD */
#hud{position:absolute;inset:0;z-index:4;pointer-events:none}
.hud-top{position:absolute;top:0;left:0;right:0;padding:max(10px,calc(env(safe-area-inset-top,0px) + 8px)) max(12px,calc(env(safe-area-inset-right,0px) + 10px)) 0 max(12px,calc(env(safe-area-inset-left,0px) + 10px));display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px}
.hud-top>.hud-group:first-child{justify-self:start;align-items:flex-start}
.hud-top>.hud-group:last-child{justify-self:end}
.hud-group{display:flex;flex-direction:column;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:10px;background:rgba(10,7,34,.62);border:1px solid var(--faint);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.lives{color:#ff5f8f}
.chip.pw{color:var(--gold)}
.chip.combo{color:#0a0a20;background:linear-gradient(180deg,#b6ff3b,#5fd01a);border:0;font-weight:700}
.chip .wdot{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.hud-mid{text-align:center;min-width:0}
.hud-mid .lvl{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;text-shadow:0 0 12px rgba(150,120,255,.7)}
.hud-mid .sc{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:#dcdaff}
.hud-mid .pl{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.3px}
#pauseBtn{pointer-events:auto}
#bossbar{position:absolute;top:max(88px,calc(env(safe-area-inset-top,0px) + 86px));left:50%;transform:translateX(-50%);width:min(82%,340px);text-align:center}
#bossbar .bn{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1;color:#ffd0e2;text-shadow:0 0 10px var(--virus)}
#bossbar .bt{height:9px;margin-top:4px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,45,120,.5)}
#bossbar .bf{height:100%;width:100%;background:linear-gradient(90deg,#ff2d78,#ffb21e);transform-origin:left;transition:transform .15s}
#bossbar.rage .bf{background:linear-gradient(90deg,#ff1a1a,#ff6a00)}
[dir=rtl] #bossbar .bf{transform-origin:right}
.hud-bot{position:absolute;bottom:0;left:0;right:0;padding:0 36px calc(env(safe-area-inset-bottom,0px) + 38px);display:flex;justify-content:space-between;align-items:flex-end}
.abtn{pointer-events:auto;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;position:relative;font-size:26px;
  background:rgba(14,10,44,.7);border:2px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.abtn .cnt{position:absolute;bottom:-4px;inset-inline-end:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--virus);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-sizing:border-box}
.abtn .lbl{position:absolute;top:-20px;font-size:12px;color:var(--dim);font-weight:600;white-space:nowrap}
#spBtn{border:0;background:rgba(14,10,44,.7)}
#spBtn .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
#spBtn .ring circle{fill:none;stroke-width:5}
#spBtn .trk{stroke:rgba(170,160,255,.22)}
#spBtn .prog{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:188.5;stroke-dashoffset:188.5;transition:stroke-dashoffset .25s}
#spBtn .inner{position:relative;width:50px;height:50px;border-radius:50%;background:#110b38;display:grid;place-items:center}
#spBtn.ready{animation:pulse 1s infinite}
#spBtn.ready .inner{background:radial-gradient(circle,#ffcf4a,#ff7a00);color:#2a1200}
@keyframes pulse{50%{box-shadow:0 0 26px rgba(255,180,40,.8)}}
.bits{font-size:12px;color:var(--toxic);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}

/* Banner */
#banner{position:absolute;left:0;right:0;top:32%;z-index:6;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:ban 2.4s ease-out forwards}
#banner .b1{font-family:var(--f-display);font-weight:700;font-size:72px;line-height:.9;text-shadow:0 0 24px rgba(160,120,255,.9);padding:0 12px}
#banner .b2{font-size:18px;font-weight:600;color:#e6e2ff;margin-top:8px;padding:0 24px;text-wrap:balance}
#banner.warn .b1{color:#ffd0e2;text-shadow:0 0 24px var(--virus),0 0 60px var(--virus)}
#banner.gold .b1{color:#fff1c2;text-shadow:0 0 24px var(--gold),0 0 70px #ff6a00}
@keyframes ban{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}

/* Planet transition card */
#planetCard{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;text-align:center;padding:0 24px}
#planetCard .pk{font-size:14px;font-weight:600;color:var(--dim);letter-spacing:1px;opacity:0;animation:fadeUp .5s .2s forwards}
#planetCard .pdone{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;color:#fff;opacity:0;animation:fadeUp .5s .3s forwards}
#planetCard .rows{display:flex;flex-direction:column;gap:4px;min-width:240px;padding:10px 16px;border-radius:14px;background:rgba(8,5,30,.7);border:1px solid var(--line);opacity:0;animation:fadeUp .5s .6s forwards}
#planetCard .rows div{display:flex;justify-content:space-between;gap:20px;font-weight:600;font-variant-numeric:tabular-nums}
#planetCard .rows span:last-child{color:var(--gold)}
#planetCard .nx{margin-top:18px;font-size:14px;color:var(--dim);opacity:0;animation:fadeUp .5s 2.6s forwards}
#planetCard .pname{font-family:var(--f-display);font-weight:700;font-size:88px;line-height:.85;opacity:0;animation:zoomIn .8s 2.8s forwards}

const IMGS={};let VIRUS_IMGS=null;
function loadArt(){return Promise.all(Object.entries(IMG_SRC).map(([k,u])=>new Promise(res=>{const im=new Image();im.onload=()=>{IMGS[k]=im;res()};im.onerror=()=>res();im.src=u}))).then(()=>{const v=[0,1,2,3,4,5].map(i=>IMGS['virus_'+i]);if(v.every(Boolean))VIRUS_IMGS=v})}

/* ---------------- Canvas & layout ---------------- */
const stage=$('#stage'),cv=$('#c'),ctx=cv.getContext('2d');
let W=450,H=800,S=1,DPR=1,SPR=2;
function layout(){
  const vw=innerWidth,vh=innerHeight;let sw=vw;const sh=vh;
  if(sw/sh>0.62)sw=Math.round(sh*0.5625);
  stage.style.width=sw+'px';
  S=sw/450;W=450;H=sh/S;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(sw*DPR);cv.height=Math.round(sh*DPR);
  buildStars();initAtmo();
  if(P){P.x=clamp(P.x,18,W-18);P.y=clamp(P.y,60,H-30);P.tx=clamp(P.tx,18,W-18);P.ty=clamp(P.ty,60,H-30)}
}

/* ---------------- Sprite factory ---------------- */
function mk(w,h,fn,sc){sc=sc||SPR;const c=document.createElement('canvas');c.width=Math.ceil(w*sc);c.height=Math.ceil(h*sc);const g=c.getContext('2d');g.scale(sc,sc);g.translate(w/2,h/2);fn(g);return{c,w,h}}
function blit(s,x,y,rot,sc,al){rot=rot||0;sc=sc||1;if(al!==undefined)ctx.globalAlpha=al;
  if(rot||sc!==1){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(sc!==1)ctx.scale(sc,sc);ctx.drawImage(s.c,-s.w/2,-s.h/2,s.w,s.h);ctx.restore()}
  else ctx.drawImage(s.c,x-s.w/2,y-s.h/2,s.w,s.h);
  if(al!==undefined)ctx.globalAlpha=1}
const glowCache={};
function glowSpr(hex,r){const k=hex+r;if(glowCache[k])return glowCache[k];return glowCache[k]=mk(r*2,r*2,g=>{const gr=g.createRadialGradient(0,0,0,0,0,r);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.18,hexA(hex,1));gr.addColorStop(.45,hexA(hex,.32));gr.addColorStop(1,hexA(hex,0));g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,TAU);g.fill()},2)}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath()}
function star5(g,r,ri){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rd=i%2?ri:r;g.lineTo(Math.cos(a)*rd,Math.sin(a)*rd)}g.closePath()}
function heartPath(g,s){g.beginPath();g.moveTo(0,s*.35);g.bezierCurveTo(-s*1.1,-s*.3,-s*.5,-s*1.05,0,-s*.45);g.bezierCurveTo(s*.5,-s*1.05,s*1.1,-s*.3,0,s*.35);g.closePath()}
function boltPath(g,s){g.beginPath();g.moveTo(s*.25,-s);g.lineTo(-s*.55,s*.12);g.lineTo(-s*.05,s*.12);g.lineTo(-s*.25,s);g.lineTo(s*.55,-s*.15);g.lineTo(s*.05,-s*.15);g.closePath()}

function drawFace(g,r,look,mood,pupil){
  const ex=r*.36,ey=-r*.08,er=r*.23;
  for(const s of[-1,1]){
    g.fillStyle='#fff';g.beginPath();g.ellipse(s*ex,ey,er,er*1.15,0,0,TAU);g.fill();
    let px=-s*er*.18,py=er*.22;if(look){px=look.x*er*.42;py=look.y*er*.42}
    g.fillStyle=pupil||'#14051f';g.beginPath();g.arc(s*ex+px,ey+py,er*.56,0,TAU);g.fill();
    g.fillStyle='#fff';g.beginPath();g.arc(s*ex+px-er*.2,ey+py-er*.2,er*.17,0,TAU);g.fill();
    g.strokeStyle='#14051f';g.lineWidth=Math.max(1.5,r*.12);g.lineCap='round';g.beginPath();g.moveTo(s*(ex+er*1.15),ey-er*1.55);g.lineTo(s*(ex-er*.85),ey-er*.85);g.stroke();
  }
  const mo=mood||0;
  g.fillStyle='#14051f';g.beginPath();g.moveTo(-r*.4,r*.3);g.quadraticCurveTo(0,r*(.72+mo*.4),r*.4,r*.3);g.quadraticCurveTo(0,r*.46,-r*.4,r*.3);g.fill();
  g.fillStyle='#fff';
  for(let i=0;i<4;i++){const x=-r*.27+i*r*.18;g.beginPath();g.moveTo(x-r*.06,r*.36);g.lineTo(x+r*.06,r*.36);g.lineTo(x,r*.5);g.closePath();g.fill()}
}

/* Viruses with planet accessories */
function virusSpr(r,col,col2,o){o=o||{};const sl=o.spikeLen??.42,sp=o.spikes??10,acc=o.acc,R=r*(1+sl)+r*.45+4;
  return mk(R*2,R*2,g=>{
    let gr=g.createRadialGradient(0,0,r*.5,0,0,R);gr.addColorStop(0,hexA(col,.4));gr.addColorStop(1,hexA(col,0));g.fillStyle=gr;g.beginPath();g.arc(0,0,R,0,TAU);g.fill();
    if(acc==='fire'){for(const[a,s]of[[-Math.PI/2,1],[-Math.PI/2-.55,.75],[-Math.PI/2+.55,.75]]){g.save();g.rotate(a+Math.PI/2);const fg=g.createLinearGradient(0,-r*1.7*s,0,-r*.5);fg.addColorStop(0,'rgba(255,240,120,0)');fg.addColorStop(.35,'#ffd23a');fg.addColorStop(1,'#ff4a0a');g.fillStyle=fg;g.beginPath();g.moveTo(-r*.35,-r*.6);g.quadraticCurveTo(-r*.3,-r*1.2*s,0,-r*1.75*s);g.quadraticCurveTo(r*.3,-r*1.2*s,r*.35,-r*.6);g.closePath();g.fill();g.restore()}}
    for(let i=0;i<sp;i++){const a=i/sp*TAU+.2,c=Math.cos(a),s=Math.sin(a),tx=c*r*(1+sl),ty=s*r*(1+sl);
      g.strokeStyle=col2;g.lineWidth=Math.max(2,r*.14);g.lineCap='round';g.beginPath();g.moveTo(c*r*.85,s*r*.85);g.lineTo(tx,ty);g.stroke();
      if(acc==='ice'){g.save();g.translate(tx,ty);g.rotate(a);g.fillStyle='#eafcff';g.beginPath();g.moveTo(r*.28,0);g.lineTo(0,r*.12);g.lineTo(-r*.12,0);g.lineTo(0,-r*.12);g.closePath();g.fill();g.restore()}

function drawShipBody(g,s){
  const c1=s.col,c2=s.col2,dark=mix(c2,'#000000',.45);g.lineJoin='round';
  for(const sd of[-1,1]){g.save();g.scale(sd,1);g.beginPath();
    switch(s.wing){
      case'delta':g.moveTo(6,-12);g.lineTo(36,16);g.lineTo(34,25);g.lineTo(8,18);break;
      case'round':g.moveTo(6,-10);g.quadraticCurveTo(42,-2,32,26);g.lineTo(8,18);break;
      case'butterfly':g.moveTo(6,-12);g.bezierCurveTo(28,-34,44,0,24,8);g.bezierCurveTo(38,16,28,32,8,18);break;
      case'angular':g.moveTo(6,-14);g.lineTo(26,2);g.lineTo(38,-2);g.lineTo(32,24);g.lineTo(8,16);break;
      case'twin':g.moveTo(6,-6);g.lineTo(30,8);g.lineTo(32,30);g.lineTo(23,32);g.lineTo(20,20);g.lineTo(8,20);break;
      default:g.moveTo(6,-8);g.lineTo(38,8);g.lineTo(29,15);g.lineTo(36,24);g.lineTo(8,20);}
    g.closePath();const gr=g.createLinearGradient(4,-10,36,26);gr.addColorStop(0,mix(c1,'#ffffff',.15));gr.addColorStop(1,dark);g.fillStyle=gr;g.fill();
    g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1;g.stroke();
    g.strokeStyle=s.glow;g.lineWidth=2;g.beginPath();g.moveTo(11,4);g.lineTo(27,15);g.stroke();
    g.fillStyle='#dfe3f6';rr(g,19,2,4,13,1.5);g.fill();g.fillStyle=s.glow;g.fillRect(19.6,1,2.8,2);
    g.restore()}
  g.beginPath();g.moveTo(0,-40);g.bezierCurveTo(10,-27,12,-4,10,14);g.lineTo(6,29);g.lineTo(-6,29);g.lineTo(-10,14);g.bezierCurveTo(-12,-4,-10,-27,0,-40);g.closePath();
  const fg=g.createLinearGradient(-11,0,11,0);fg.addColorStop(0,dark);fg.addColorStop(.38,mix(c1,'#ffffff',.4));fg.addColorStop(.6,c1);fg.addColorStop(1,dark);g.fillStyle=fg;g.fill();

  g.fillStyle=s.glow;g.beginPath();g.moveTo(0,-38);g.lineTo(2,-30);g.lineTo(-2,-30);g.closePath();g.fill();

}

  rows.forEach((r,i)=>{const d=document.createElement('div');d.className='brow'+((LB.db&&r.id===LB.uid)||(!LB.db&&r.me)?' me':'');
    const rk=document.createElement('div');rk.className='rk';rk.textContent=i+1;const nm=document.createElement('div');nm.className='nm';const b=document.createElement('b');b.textContent=r.name;const sp=document.createElement('span');
    const lv=clamp(r.level|0,1,100);sp.textContent=t('reached',{n:lv})+' · '+pName(planetOf(lv));nm.append(b,sp);const sc=document.createElement('div');sc.className='sc';sc.textContent=fmt(r.score);d.append(rk,nm,sc);box.appendChild(d)});
  $('#boardNote').textContent=LB.db?t('boardLive'):t('boardLocal')}
function openBoard(){go('#board');if(LB.db&&!LB.unsub){try{LB.unsub=LB.db.collection('scores').orderBy('score','desc').limit(50).onSnapshot(snap=>{LB.rows=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(!$('#board').hidden)renderBoard()},()=>{LB.unsub=null})}catch(e){}}renderBoard()}
let pendingScore=null;
function askName(score,level,lives){pendingScore={score:Math.round(score),level,lives};$('#nameScore').textContent=fmt(score);$('#nameErr').textContent='';const inp=$('#nameIn');try{inp.value=localStorage.getItem('vi_name')||''}catch(e){}show('#nameModal');setTimeout(()=>inp.focus(),50)}
async function submitName(){const name=$('#nameIn').value.trim().replace(/\s+/g,' ');const ok=nameOk(name);if(ok!=='ok'){$('#nameErr').textContent=ok==='short'?t('shortName'):t('badName');return}
  try{localStorage.setItem('vi_name',name)}catch(e){}const ps=pendingScore;hide('#nameModal');const row={name,score:ps.score,level:ps.level,lives:ps.lives,ship:save.sel,ts:Date.now()};let shared=false;
  if(LB.db&&LB.uid){try{const ref=LB.db.doc('scores/'+LB.uid);const old=await ref.get();const prev=old.exists?old.data():null;
      if(!prev||!(prev.score>=row.score))await ref.set(row);else if(prev.name!==name)await ref.set(Object.assign({},prev,{name}));shared=true}catch(e){toast(t('noWrite'))}}
  if(!shared){const lb=localBoard();lb.forEach(r=>r.me=false);row.me=true;lb.push(row);lb.sort((a,b)=>b.score-a.score);MEM_BOARD=lb.slice(0,30);try{localStorage.setItem('vi_board',JSON.stringify(MEM_BOARD))}catch(e){}}
  toast(t('saved'));if(!$('#over').hidden&&save.run){save.run=Object.assign({},save.run,{score:Math.floor(save.run.score*.75),lives:3,p:1});persist()}['#over','#victory'].forEach(hide);mode='menu';openBoard()}

/* ---------------- Input ---------------- */
let drag=null;
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}
cv.addEventListener('pointerdown',e=>{SFX.init();if(mode!=='play'||!P)return;const p=pt(e);drag={id:e.pointerId,ox:P.tx-p.x,oy:P.ty-p.y};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id||mode!=='play')return;const p=pt(e);P.tx=clamp(p.x+drag.ox,18,W-18);P.ty=clamp(p.y+drag.oy,70,H-34)});
const endDrag=e=>{if(drag&&e.pointerId===drag.id)drag=null};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')K.l=1;if(k==='arrowright'||k==='d')K.r=1;if(k==='arrowup'||k==='w')K.u=1;if(k==='arrowdown'||k==='s')K.d=1;
  if(mode==='play'){if(k===' '){e.preventDefault();useBomb()}if(k==='e'||k==='shift')useSpecial();if(k==='p'||k==='escape')pauseGame(true)}
  else if(mode==='paused'&&(k==='p'||k==='escape'))resumeGame()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')K.l=0;if(k==='arrowright'||k==='d')K.r=0;if(k==='arrowup'||k==='w')K.u=0;if(k==='arrowdown'||k==='s')K.d=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pauseGame();if(SFX.c){document.hidden?SFX.c.suspend():SFX.c.resume()}});
addEventListener('resize',layout);

let pauseCount=0;
function pauseGame(manual){if(mode!=='play')return;mode='paused';refreshPauseToggles();show('#pause');if(manual===true){pauseCount++;if(!save.premium&&pauseCount%3===0)Ads.interstitial()}}
function resumeGame(){hide('#pause');mode='play'}
function refreshPauseToggles(){$('#pSound').textContent=t('sound')+': '+(save.sound?t('on'):t('off'));$('#pMusic').textContent=t('music')+': '+(save.music?t('on'):t('off'))}
function toMenu(){mode='menu';$('#banner').classList.remove('show');$('#planetCard').hidden=true;G.warp=null;['#pause','#over','#victory'].forEach(hide);go('#menu')}

/* ---------------- Wire buttons ---------------- */
function bind(sel,fn){document.querySelectorAll(sel).forEach(el=>el.addEventListener('click',e=>{SFX.init();SFX.play('click');fn(e)}))}
$('#pauseBtn').innerHTML=IC.pause;$('#boardBtn').innerHTML=IC.trophy;$('#setBtn').innerHTML=IC.gear;$('#bombIc').innerHTML=IC.bomb;$('#spIc').innerHTML=IC.star;
$('#prevShip').innerHTML=IC.back;$('#nextShip').innerHTML=IC.chev;
bind('#playBtn',()=>{const r=save.run;if(r&&r.level>1)askBoost(r.level,r);else askBoost(1,null)});
bind('#newBtn',()=>askBoost(1,null));
bind('#hangarBtn',()=>{hIdx=Math.max(0,SHIPS.findIndex(s=>s.id===save.sel));go('#hangar')});
bind('#levelsBtn',()=>go('#levels'));
bind('#setBtn',()=>go('#settings'));
bind('.back',()=>go('#menu'));
const toggleLang=()=>{lang=save.lang=lang==='he'?'en':'he';persist();applyLang()};
bind('#langBtn',toggleLang);bind('#tLang',toggleLang);
bind('#tSound',()=>{save.sound=!save.sound;persist();refreshSettings()});
bind('#tMusic',()=>{save.music=!save.music;persist();SFX.setMusic(save.music);refreshSettings()});
bind('#pSound',()=>{save.sound=!save.sound;persist();refreshPauseToggles()});
bind('#pMusic',()=>{save.music=!save.music;persist();SFX.setMusic(save.music);refreshPauseToggles()});
bind('#restoreBtn',()=>Store.restore().then(list=>{if(list&&list.includes&&list.includes('everything_pack')){grantPack();toast(t('restored'))}else toast(t('noPurch'))}));
bind('#packBtn',buyPack);
bind('#prevShip',()=>{hIdx=(hIdx+SHIPS.length-1)%SHIPS.length;refreshHangar()});
bind('#nextShip',()=>{hIdx=(hIdx+1)%SHIPS.length;refreshHangar()});
bind('#boostAd',()=>{hide('#boost');Ads.rewarded().then(ok=>{startRun(pending.n,ok,pending.cont)})});
bind('#boostBack',()=>hide('#boost'));
$('#boost').addEventListener('click',e=>{if(e.target.id==='boost')hide('#boost')});
bind('#boostNo',()=>{hide('#boost');startRun(pending.n,false,pending.cont)});
bind('#pauseBtn',()=>pauseGame(true));
bind('#resumeBtn',resumeGame);
bind('#restartBtn',()=>{hide('#pause');const r=save.run;startRun(G.level,false,r&&r.level===G.level?r:null)});
bind('#quitBtn',toMenu);
bind('#reviveBtn',revive);
bind('#retryBtn',()=>{hide('#over');askBoost(G.level,Object.assign({},save.run||{},{score:Math.floor(((save.run&&save.run.score)||G.score)*.75),lives:3,p:1}))});
bind('#overMenu',()=>{const r=save.run;if(r)save.run=Object.assign({},r,{score:Math.floor(r.score*.75),lives:3,p:1});persist();toMenu()});
bind('#vicMenu',toMenu);
bind('#boardBtn',openBoard);
bind('#vicSave',()=>askName(G.score+G.lives*50000,100,G.lives));
bind('#overSave',()=>askName(G.score,G.level,0));
bind('#nameOk',submitName);
bind('#nameNo',()=>hide('#nameModal'));
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')submitName();e.stopPropagation()});
bind('#adMain',()=>endAd(adRewarded));
bind('#adSkip',()=>endAd(false));
bind('#buyOk',()=>{hide('#buyModal');const r=buyResolve;buyResolve=null;r&&r(true)});
bind('#buyNo',()=>{hide('#buyModal');const r=buyResolve;buyResolve=null;r&&r(false)});
$('#bombBtn').addEventListener('pointerdown',e=>{e.stopPropagation();SFX.init();useBomb()});
$('#spBtn').addEventListener('pointerdown',e=>{e.stopPropagation();SFX.init();useSpecial()});

/* ---------------- Boot ---------------- */
loadArt().then(()=>{layout();buildSprites();setPlanetVisuals(planetOf(save.run?save.run.level:1));initRain();applyLang();go('#menu');
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{update(dt);render(dt);drawPreview(dt)}catch(err){console.error(err)}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
});
</script>

</body></html>
