  <style>
    /* ---- עמוד השורטס: מסך מלא, גלילה אנכית בלבד, נגן יוטיוב בשליטה מלאה ---- */
    html, body { height: 100%; overflow: hidden !important; overscroll-behavior: none; background: #000; }
    body { padding-bottom: 0 !important; position: fixed; inset: 0; width: 100%; } /* נעול: בלי משיכה לרענון ובלי קפיצות */
    .bg-aurora, .bg-stars, .bg-noise { display: none !important; }
    .site-footer, .ticker-wrap, .to-top, .scroll-progress, .a11y-btn, .sparks { display: none !important; }
    main { animation: none !important; transform: none !important; }
    :root { --top: 74px; --bottom: 0px; --slide-h: calc(100dvh - var(--top) - var(--bottom)); }
    @supports not (height: 100dvh) { :root { --slide-h: calc(100vh - var(--top) - var(--bottom)); } }

    .stage { position: fixed; top: var(--top); bottom: var(--bottom); left: 0; right: 0; display: flex; justify-content: center; align-items: stretch; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
    .feed { position: relative; height: 100%; width: min(100%, calc((var(--slide-h) - 24px) * 9 / 16)); overflow: hidden; }
    .slot { position: absolute; inset: 0; will-change: transform; transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1); background: #000; overflow: hidden; }
    .feed.dragging .slot { transition: none; }
    .slot .box { position: absolute; inset: 12px 0; border-radius: 18px; overflow: hidden; background: #0a0a14; }
    .slot .bg { position: absolute; inset: -10%; background: center / cover no-repeat; filter: blur(30px) brightness(0.45); display: none; }
    @media (min-width: 901px) { .slot.near .bg { display: block; } } /* רקע מטושטש רק בדסקטופ ורק לשקופיות הסמוכות */
    .slot .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.4s; }
    .slot .yt { position: absolute; inset: 0; overflow: hidden; }
    .slot .yt iframe { position: absolute; left: 0; width: 100%; top: -58px; height: calc(100% + 58px); border: 0; } /* פס הכותרת של יוטיוב נחתך מחוץ למסגרת */
    .slot .yt { opacity: 0; transition: opacity 0.35s; }
    .slot.playing .yt { opacity: 1; }
    .slot.playing .poster { opacity: 0; }
    .slot .touch { position: absolute; inset: 0 0 70px; cursor: pointer; } /* שכבת מגע מעל הנגן: הקשה = השהיה/המשך, גלילה עוברת חלק */
    .slot .flash { position: absolute; top: 50%; left: 50%; width: 88px; height: 88px; margin: -44px 0 0 -44px; border-radius: 50%; background: rgba(0,0,0,0.55); display: grid; place-items: center; opacity: 0; transform: scale(0.7); pointer-events: none; transition: opacity 0.25s, transform 0.25s; }
    .slot .flash svg { width: 42px; height: 42px; fill: #fff; }
    .slot .flash.show { opacity: 1; transform: scale(1); }
    .slot .flash.stay { opacity: 1; transform: scale(1); }
    .slot .spin { position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff; animation: spin 0.9s linear infinite; pointer-events: none; opacity: 0; transition: opacity 0.3s 0.4s; }
    .slot.loading .spin { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* מידע על הסרטון: ערוץ וכותרת, כמו ביוטיוב */
    .slot .info { position: absolute; bottom: 0; inset-inline: 0; padding: 60px 14px 22px 74px; background: linear-gradient(to top, rgba(0,0,0,0.82), rgba(0,0,0,0.35) 60%, transparent); color: #fff; pointer-events: none; display: grid; gap: 8px; }
    .slot .ch { display: flex; align-items: center; gap: 10px; pointer-events: auto; text-decoration: none; color: #fff; width: max-content; max-width: 100%; }
    .slot .ch img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8); background: #222; }
    .slot .ch b { font-weight: 700; font-size: 0.95rem; text-shadow: 0 1px 8px rgba(0,0,0,0.8); }
    .slot .ch .sub { font-size: 0.72rem; font-weight: 700; background: #fff; color: #000; padding: 4px 10px; border-radius: 999px; }
    .slot .ttl { font-size: 0.98rem; line-height: 1.35; font-weight: 600; text-shadow: 0 1px 10px rgba(0,0,0,0.9); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .slot .views { font-size: 0.8rem; color: rgba(255,255,255,0.75); }

    /* פס התקדמות ניתן לגרירה (להריץ קדימה ואחורה) */
    .slot .bar { position: absolute; bottom: 0; inset-inline: 0; height: 22px; display: flex; align-items: flex-end; cursor: pointer; touch-action: none; }
    .slot .bar .track { width: 100%; height: 3px; background: rgba(255,255,255,0.28); transition: height 0.15s; }
    .slot .bar:hover .track, .slot .bar.drag .track { height: 6px; }
    .slot .bar .fill { height: 100%; width: 0; background: #fff; transform-origin: right; }
    .slot .bar .knob { position: absolute; bottom: -4px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translateX(50%) scale(0); transition: transform 0.15s; box-shadow: 0 0 8px rgba(0,0,0,0.6); }
    .slot .bar:hover .knob, .slot .bar.drag .knob { transform: translateX(50%) scale(1); }
    .slot .time { position: absolute; bottom: 28px; inset-inline-end: 14px; font-size: 0.75rem; background: rgba(0,0,0,0.6); color: #fff; padding: 2px 8px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .slot .bar.drag ~ .time { opacity: 1; }

    /* כפתורי פעולה בצד השקופית (בתוך הסרטון במובייל, לצידו בדסקטופ) */
    .slot .acts { position: absolute; bottom: 24px; inset-inline-end: 8px; display: grid; gap: 14px; justify-items: center; z-index: 3; }
    .acts button, .acts a { width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(40,40,60,0.55); color: #fff; display: grid; place-items: center; cursor: pointer; text-decoration: none; transition: transform 0.15s, background 0.2s; }
    .acts button:active, .acts a:active { transform: scale(0.88); }
    .acts button:hover, .acts a:hover { background: rgba(255,255,255,0.28); }
    .acts svg { width: 24px; height: 24px; fill: currentColor; }
    .acts .lbl { font-size: 0.68rem; color: #fff; margin-top: -8px; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
    @media (min-width: 901px) {
      .slot .acts { bottom: 40px; inset-inline-end: 10px; }
    }

    /* חיצים בדסקטופ */
    .nav-arrows { position: fixed; inset-inline-start: calc(50% + (var(--slide-h) - 24px) * 9 / 32 + 72px); top: 50%; transform: translateY(-50%); display: grid; gap: 14px; z-index: 5; }
    .nav-arrows button { width: 50px; height: 50px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.1); color: #fff; font-size: 1.3rem; cursor: pointer; display: grid; place-items: center; transition: background 0.2s, transform 0.15s; }
    .nav-arrows button:hover { background: rgba(255,255,255,0.25); }
    .nav-arrows button:active { transform: scale(0.9); }
    .nav-arrows svg { width: 24px; height: 24px; fill: currentColor; }
    @media (max-width: 900px) { .nav-arrows { display: none; } }

    /* כפתור הפעלת קול (עד המגע הראשון) */
    .sound-tip { position: fixed; top: calc(var(--top) + 14px); left: 50%; transform: translateX(-50%); z-index: 8; background: #fff; color: #000; border: 0; border-radius: 999px; padding: 10px 18px; font: 700 0.95rem/1 var(--font-body, Heebo, sans-serif); display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); cursor: pointer; animation: tip-in 0.5s var(--ease) both; }
    .sound-tip svg { width: 20px; height: 20px; fill: currentColor; }
    @keyframes tip-in { from { opacity: 0; transform: translate(-50%, -10px); } }
    .sound-tip.hide { opacity: 0; pointer-events: none; transition: opacity 0.3s; }

    /* סרגל עליון קטן במובייל במקום התפריט הגדול: חזרה, לוגו, "שורטס" */
    .mini-top { display: none; }
    @media (max-width: 900px) {
      :root { --top: 0px; --bottom: calc(68px + env(safe-area-inset-bottom)); }
      .site-header { display: none !important; }
      .stage { bottom: var(--bottom); }
      .feed { width: 100%; }
      .slot .box { inset: 0; border-radius: 0; }
      .slot .touch { inset: 0 0 110px; }
      .mini-top { display: flex; position: fixed; top: 0; inset-inline: 0; z-index: 6; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; align-items: center; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent); pointer-events: none; }
      .mini-top > * { pointer-events: auto; }
      .mini-top a { color: #fff; text-decoration: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.35); }
      .mini-top a svg { width: 22px; height: 22px; fill: currentColor; }
      .mini-top .t { font-family: var(--font-display, inherit); color: #fff; font-size: 1.3rem; text-shadow: 0 2px 10px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 8px; }
      .mini-top .t img { height: 30px; width: auto; }
      .tabbar { background: rgba(0,0,0,0.9); }
    }
    .toast { position: fixed; bottom: calc(var(--bottom) + 24px); left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 9; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    .empty-feed { height: 100%; display: grid; place-items: center; text-align: center; padding: 30px; color: #fff; }
  </style>

<script>
  // טוען את ה-API של יוטיוב עם ניסיונות חוזרים (רשתות מסוימות מפילות את הניסיון הראשון)
  (function () {
    let tries = 0;
    const add = () => { tries++; const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api" + (tries > 1 ? "?r=" + tries : ""); sc.async = true; sc.onerror = () => { if (tries < 4) setTimeout(add, 400); }; document.head.append(sc); };
    add();
    const check = () => { if (window.YT && window.YT.Player) return; if (tries < 4) add(); setTimeout(check, 5000); };
    setTimeout(check, 5000);
  })();
</script>

<script>
(async () => {
  const feed = document.getElementById("feed"), stage = document.getElementById("stage"), S = window.SAPIR;
  const SVG = {
    play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
    sound: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
    muted: '<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5zM19 12a7 7 0 0 1-1.5 4.3l1.4 1.4A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8L19.7 21l1.3-1.3zM12 4 9.9 6.1 12 8.2z"/></svg>',
    share: '<svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>',
    yt: '<svg viewBox="0 0 24 24"><path d="M23 7.1a3 3 0 0 0-2.1-2.1C19 4.5 12 4.5 12 4.5s-7 0-8.9.5A3 3 0 0 0 1 7.1 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.9 3 3 0 0 0 3.1 19c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.4-1.6.5-3.3.5-4.9s-.1-3.3-.5-4.9zM9.8 15.5v-7l6 3.5-6 3.5z"/></svg>'
  };
  const startId = new URLSearchParams(location.search).get("v");
  history.replaceState(null, "", "shorts.html");

  /* ---- הרשימה: סדר אקראי חדש בכל כניסה, אינסופי ---- */
  let shorts = [];
  try { shorts = window.shortsOf(await window.loadLibrary()); }
  catch (e) { try { const ch = S.channels.find(c => c.id === "sapirtv"); shorts = await window.fetchChannelVideos(window.channelIdOf(ch)); } catch (e2) {} }
  if (!shorts.length) { feed.innerHTML = `<div class="empty-feed"><div><h2>השורטס ייטענו כאן בעוד רגע</h2><a class="btn btn-ink" href="index.html">לדף הבית</a></div></div>`; return; }
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  const newest = shorts.slice(0, Math.max(20, Math.floor(shorts.length * 0.15))), rest = shorts.slice(newest.length);
  const mix = (sd) => { const a = window.shuffled(newest, sd), b = window.shuffled(rest, (sd ^ 0x9e3779b9) >>> 0), out = []; let i = 0, j = 0; while (i < a.length || j < b.length) { if (i < a.length) out.push(a[i++]); if (j < b.length) out.push(b[j++]); if (j < b.length) out.push(b[j++]); } return out; };
  let order = mix(seed), round = 1;
  if (startId) { const k = order.findIndex(v => v.id === startId); if (k > 0) order = [order[k], ...order.slice(0, k), ...order.slice(k + 1)]; else if (k < 0) { const v = shorts.find(x => x.id === startId); if (v) order.unshift(v); } }
  const item = (i) => { while (i >= order.length) order = order.concat(mix((seed + round++ * 7919) >>> 0)); return order[i]; };
  const bad = new Set(); // סרטונים שיוטיוב לא מאפשר להטמיע

  /* ---- שלושה חריצים קבועים (קודם, נוכחי, הבא). כל חריץ מחזיק נגן יוטיוב אחד לכל חיי הדף ומחליף סרטון עם loadVideoById.
         ככה אין iframe חדש לכל שורט (יוטיוב מאט מאוד אחרי כמה טעינות כאלה) והמעבר מיידי. ---- */
  const chOf = id => S.channels.find(c => c.id === id) || S.channels[0];
  const slotHtml = (k) => `
    <section class="slot loading" data-k="${k}">
      <div class="box">
        <img class="poster" alt="">
        <div class="yt"><div id="yt-${k}"></div></div>
        <div class="spin"></div>
        <div class="touch" aria-hidden="true"></div>
        <div class="flash">${SVG.play}</div>
        <div class="info">
          <a class="ch" href="#" target="_blank" rel="noopener"><img alt=""><b></b><span class="sub">הרשמה</span></a>
          <div class="ttl"></div>
          <div class="views"></div>
        </div>
        <div class="acts">
          <button class="b-mute" aria-label="קול">${SVG.muted}</button>
          <button class="b-share" aria-label="שיתוף">${SVG.share}</button><span class="lbl">שיתוף</span>
          <a class="b-yt" href="#" target="_blank" rel="noopener" aria-label="ביוטיוב">${SVG.yt}</a><span class="lbl">יוטיוב</span>
        </div>
        <div class="bar" aria-label="מיקום בסרטון"><div class="track"><div class="fill"></div></div><div class="knob"></div></div>
        <div class="time">0:00</div>
      </div>
    </section>`;
  feed.innerHTML = [0, 1, 2].map(slotHtml).join("");
  const slots = [...feed.children].map((el, k) => ({ k, el, p: null, ready: false, index: -9, vid: null, user: "", warm: false }));
  const H = () => feed.clientHeight;
  let current = 0, muted = localStorage.getItem("sapir-shorts-sound") !== "1", soundUnlocked = !muted, animating = false;
  const slotFor = (index) => slots.find(s => s.index === index);
  const curSlot = () => slotFor(current);
  const place = (s, offset, drag = 0) => { s.el.style.transform = `translate3d(0, ${offset * H() + drag}px, 0)`; s.el.style.visibility = offset < -1 || offset > 1 ? "hidden" : ""; };
  const layout = (drag = 0) => { for (const s of slots) place(s, s.index - current, drag); };

  const fill = (s, index) => { // מכין את החריץ לסרטון שבמקום index: פוסטר, כותרת, ערוץ
    const v = item(index), c = chOf(v.channel);
    s.index = index; s.vid = v.id; s.user = ""; s.warm = false;
    s.el.classList.remove("playing"); s.el.classList.add("loading");
    const fl = s.el.querySelector(".flash"); fl.className = "flash"; fl.innerHTML = SVG.play;
    const po = s.el.querySelector(".poster"); po.onerror = () => { po.onerror = null; po.src = v.thumb; }; po.src = `https://i.ytimg.com/vi/${v.id}/oardefault.jpg`;
    const ch = s.el.querySelector(".ch"); ch.href = c.url; ch.querySelector("img").src = c.avatar || ""; ch.querySelector("b").textContent = c.name;
    s.el.querySelector(".ttl").textContent = v.title; s.el.querySelector(".views").textContent = v.views ? window.fmtViews(v.views) : "";
    s.el.querySelector(".b-yt").href = `https://www.youtube.com/shorts/${v.id}`;
    s.el.querySelector(".fill").style.width = "0"; s.el.querySelector(".time").textContent = "0:00";
    s.el.setAttribute("aria-label", v.title);
  };

  /* ---- נגני יוטיוב ---- */
  const ytReady = new Promise(res => { if (window.YT && YT.Player) return res(); window.onYouTubeIframeAPIReady = res; const poll = setInterval(() => { if (window.YT && YT.Player) { clearInterval(poll); res(); } }, 300); });
  setTimeout(() => { if (!(window.YT && YT.Player)) { const s0 = slots[0]; s0.el.classList.remove("loading"); const fl = s0.el.querySelector(".flash"); fl.classList.add("stay"); } }, 9000); // אם יוטיוב לא עונה: כפתור נגינה במקום ספינר אינסופי
  const LOG = window.__shortsLog = [];
  const makePlayer = (s) => new Promise(resolve => {
    s.p = new YT.Player(`yt-${s.k}`, {
      host: "https://www.youtube.com", videoId: s.vid, width: "100%", height: "100%",
      playerVars: { autoplay: 0, mute: 1, playsinline: 1, controls: 0, rel: 0, iv_load_policy: 3, modestbranding: 1, fs: 0, disablekb: 1, cc_load_policy: 0, origin: location.origin },
      events: {
        onReady: () => { s.ready = true; LOG.push(["ready", s.k]); resolve(s); },
        onStateChange: (e) => {
          const st = e.data; LOG.push([Math.round(performance.now()), s.k, s.index, st, current]);
          if (st === YT.PlayerState.PLAYING) {
            if (s.index === current) { s.el.classList.add("playing"); s.el.classList.remove("loading"); s.el.querySelector(".flash").classList.remove("stay"); }
            else if (!(s.index === current + 1 && s.warm)) { try { s.p.pauseVideo(); } catch (x) {} }
          } else if (st === YT.PlayerState.PAUSED) {
            s.el.classList.remove("loading");
          } else if (st === YT.PlayerState.ENDED) { try { s.p.seekTo(0, true); s.p.playVideo(); } catch (x) {} } // שורט חוזר על עצמו
        },
        onError: () => { bad.add(s.vid); s.el.classList.remove("loading"); s.el.querySelector(".ttl").textContent = "הסרטון הזה לא זמין כרגע, ממשיכים לבא"; if (s.index === current) setTimeout(() => go(1), 400); }
      }
    });
  });
  const SAVE_DATA = !!(navigator.connection && navigator.connection.saveData);
  const sameVideo = (s) => { try { return s.p.getVideoData && s.p.getVideoData().video_id === s.vid; } catch (e) { return false; } };
  const load = (s, warm) => { // טוען לנגן של החריץ את הסרטון שלו, בלי iframe חדש. warm = מתחיל לנגן בשקט כדי שיהיה מוכן מיד
    if (!s.ready) return;
    try {
      const same = sameVideo(s), st = s.p.getPlayerState();
      if (same && (st === 1 || st === 2 || st === 3 || (!warm))) return; // כבר טעון
      if (warm) { s.p.mute(); s.warm = true; if (same) s.p.playVideo(); else s.p.loadVideoById(s.vid); }
      else s.p.cueVideoById(s.vid);
    } catch (e) {}
  };
  const playCurrent = () => {
    const s = curSlot(); if (!s || !s.ready) return;
    s.user = "";
    try {
      const st = s.p.getPlayerState();
      if (sameVideo(s) && (st === 1 || st === 2 || st === 3)) { if (s.p.getCurrentTime() > 0.6) s.p.seekTo(0, true); if (muted) s.p.mute(); else s.p.unMute(); s.p.playVideo(); if (st === 1) { s.el.classList.add("playing"); s.el.classList.remove("loading"); } }
      else { if (muted) s.p.mute(); else s.p.unMute(); s.p.loadVideoById(s.vid); }
    } catch (e) {}
    s.warm = false;
    // אם הדפדפן חסם ניגון עם קול: חוזרים לשקט; אם חסם גם בשקט: כפתור נגינה גדול (הקשה אחת ומנגן)
    const check = (tries) => setTimeout(() => {
      try {
        if (s.index !== current || s.user === "pause") return;
        const st = s.p.getPlayerState();
        if (st === 1 || st === 3) return;
        if (!muted && tries === 0) { muted = true; soundUnlocked = false; s.p.mute(); s.p.playVideo(); updateMuteUi(); check(1); return; }
        s.el.classList.remove("loading"); const fl = s.el.querySelector(".flash"); fl.innerHTML = SVG.play; fl.classList.add("stay");
      } catch (e) {}
    }, 1600);
    check(0);
  };

  const prepareNeighbors = () => { // דואג שיש חריץ לקודם ולבא, ממחזר את החריץ שיצא מהחלון
    const want = [current - 1, current, current + 1].filter(i => i >= 0);
    for (const i of want) if (!slotFor(i)) { const free = slots.find(s => !want.includes(s.index)); fill(free, i); if (i === current + 1) load(free, !SAVE_DATA); else if (i === current - 1) load(free, false); }
  };
  const activate = () => {
    for (const s of slots) if (s.ready && s.index !== current && s.index !== current + 1) { try { s.p.pauseVideo(); } catch (e) {} }
    prepareNeighbors(); layout();
    if (bad.has(curSlot().vid)) { setTimeout(() => go(1), 300); return; }
    playCurrent();
    const nx = slotFor(current + 1); if (nx) load(nx, !SAVE_DATA);
  };
  const go = (d) => {
    const n = current + d; if (n < 0 || animating) return;
    animating = true; current = n; layout();
    const prev = slotFor(n - d); if (prev && prev.ready) { try { prev.p.pauseVideo(); } catch (e) {} }
    const nxt = slotFor(n); if (nxt && nxt.ready && sameVideo(nxt)) { try { if (muted) nxt.p.mute(); else nxt.p.unMute(); nxt.p.playVideo(); } catch (e) {} } // מתחיל כבר בזמן האנימציה
    setTimeout(() => { animating = false; activate(); }, 340);
  };

  /* ---- קול ---- */
  const soundTip = document.getElementById("sound-tip");
  const updateMuteUi = () => { feed.querySelectorAll(".b-mute").forEach(b => { b.innerHTML = muted ? SVG.muted : SVG.sound; b.setAttribute("aria-label", muted ? "הפעלת קול" : "השתקה"); }); soundTip.hidden = !muted; };
  const setMuted = (m) => { muted = m; localStorage.setItem("sapir-shorts-sound", m ? "0" : "1"); const s = curSlot(); if (s && s.ready) { try { m ? s.p.mute() : s.p.unMute(); if (!m && s.user !== "pause") s.p.playVideo(); } catch (e) {} } updateMuteUi(); };
  const unlock = () => { if (soundUnlocked) return; soundUnlocked = true; setMuted(false); };
  updateMuteUi();
  soundTip.addEventListener("click", unlock);

  /* ---- מגע וגרירה: החלקה מזיזה את הערימה עם האצבע, שחרור קובע לאן ---- */
  let drag = null;
  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".bar") || e.target.closest("button") || e.target.closest("a")) return;
    drag = { y0: e.clientY, t0: performance.now(), dy: 0, moved: false, id: e.pointerId };
    feed.classList.add("dragging");
  }, { passive: true });
  stage.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dy = e.clientY - drag.y0;
    if (Math.abs(drag.dy) > 6) drag.moved = true;
    if (drag.moved) { let d = drag.dy; if (current === 0 && d > 0) d *= 0.35; layout(d); }
  }, { passive: true });
  const endDrag = (e) => {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const { dy, t0, moved } = drag; drag = null; feed.classList.remove("dragging");
    if (!moved) { unlock(); if (performance.now() - t0 < 350) togglePause(); return; }
    const v = Math.abs(dy) / Math.max(1, performance.now() - t0), h = H();
    if (dy < -h * 0.18 || (dy < -20 && v > 0.45)) { unlock(); go(1); }
    else if ((dy > h * 0.18 || (dy > 20 && v > 0.45)) && current > 0) { unlock(); go(-1); }
    else layout();
  };
  addEventListener("pointerup", endDrag); addEventListener("pointercancel", endDrag);
  let wheelLock = 0;
  stage.addEventListener("wheel", (e) => { e.preventDefault(); const now = Date.now(); if (now - wheelLock < 600 || Math.abs(e.deltaY) < 8) return; wheelLock = now; go(e.deltaY > 0 ? 1 : -1); }, { passive: false });
  document.getElementById("next").addEventListener("click", () => { unlock(); go(1); });
  document.getElementById("prev").addEventListener("click", () => { unlock(); go(-1); });
  const seekBy = (sec) => { const s = curSlot(); if (s && s.ready) { try { s.p.seekTo(Math.max(0, s.p.getCurrentTime() + sec), true); } catch (e) {} } };
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === "j") { e.preventDefault(); unlock(); go(1); }
    else if (e.key === "ArrowUp" || e.key === "PageUp" || e.key === "k") { e.preventDefault(); unlock(); go(-1); }
    else if (e.key === " ") { e.preventDefault(); togglePause(); }
    else if (e.key.toLowerCase() === "m") setMuted(!muted);
    else if (e.key === "ArrowRight") seekBy(-5);
    else if (e.key === "ArrowLeft") seekBy(5);
  });

  /* ---- הקשה: השהיה/המשך ---- */
  const togglePause = () => {
    const s = curSlot(); if (!s || !s.ready) return;
    const fl = s.el.querySelector(".flash");
    let st; try { st = s.p.getPlayerState(); } catch (e) { return; }
    if (st === 1 || st === 3) { s.user = "pause"; s.p.pauseVideo(); fl.innerHTML = SVG.pause; fl.classList.add("show"); setTimeout(() => { fl.classList.remove("show"); if (s.user === "pause") { fl.innerHTML = SVG.play; fl.classList.add("stay"); } }, 500); }
    else { s.user = ""; s.p.playVideo(); fl.innerHTML = SVG.play; fl.classList.remove("stay"); fl.classList.add("show"); setTimeout(() => fl.classList.remove("show"), 500); }
  };
  feed.addEventListener("click", (e) => {
    const el = e.target.closest(".slot"); if (!el) return;
    const s = slots[+el.dataset.k];
    if (e.target.closest(".b-mute")) { soundUnlocked = true; setMuted(!muted); return; }
    if (e.target.closest(".b-share")) { share(s); }
  });
  const toast = (t) => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 1800); };
  const share = async (s) => {
    const url = `${location.origin}${location.pathname.replace(/[^/]*$/, "")}shorts.html?v=${s.vid}`, title = s.el.getAttribute("aria-label");
    try { if (navigator.share) await navigator.share({ title, text: `${title} | משפחת ספיר`, url }); else { await navigator.clipboard.writeText(url); toast("הקישור הועתק"); } } catch (e) {}
  };

  /* ---- פס התקדמות: מתעדכן כל רבע שנייה, גרירה מריצה קדימה ואחורה ---- */
  const fmt = sec => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
  let barDrag = false;
  setInterval(() => {
    const s = curSlot(); if (!s || !s.ready) return;
    try { const st0 = s.p.getPlayerState(); if (st0 === 1) { s.el.classList.add("playing"); s.el.classList.remove("loading"); } } catch (e) {}
    if (barDrag) return;
    try { const d = s.p.getDuration() || 0, t = s.p.getCurrentTime() || 0; if (d) { const pct = Math.min(100, t / d * 100); s.el.querySelector(".fill").style.width = pct + "%"; s.el.querySelector(".knob").style.insetInlineStart = pct + "%"; s.el.querySelector(".time").textContent = `${fmt(t)} / ${fmt(d)}`; } } catch (e) {}
  }, 250);
  const barPct = (bar, x) => { const r = bar.getBoundingClientRect(); return Math.max(0, Math.min(1, (r.right - x) / r.width)); }; // RTL: ההתחלה מימין
  feed.addEventListener("pointerdown", (e) => {
    const bar = e.target.closest(".bar"); if (!bar) return;
    const s = slots[+bar.closest(".slot").dataset.k]; if (s.index !== current || !s.ready) return;
    e.preventDefault(); e.stopPropagation(); bar.setPointerCapture(e.pointerId); barDrag = true; bar.classList.add("drag");
    const move = (ev) => { const p = barPct(bar, ev.clientX); s.el.querySelector(".fill").style.width = p * 100 + "%"; s.el.querySelector(".knob").style.insetInlineStart = p * 100 + "%"; try { const d = s.p.getDuration() || 0; s.el.querySelector(".time").textContent = `${fmt(p * d)} / ${fmt(d)}`; } catch (x) {} };
    move(e);
    const up = (ev) => { bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); bar.removeEventListener("pointercancel", up); bar.classList.remove("drag"); try { const d = s.p.getDuration() || 0; s.p.seekTo(barPct(bar, ev.clientX) * d, true); s.p.playVideo(); s.user = ""; } catch (x) {} barDrag = false; };
    bar.addEventListener("pointermove", move); bar.addEventListener("pointerup", up); bar.addEventListener("pointercancel", up);
  });

  /* ---- התחלה: שלושה נגנים נוצרים פעם אחת בלבד ---- */
  fill(slots[0], 0); fill(slots[1], 1); fill(slots[2], 2); slots[2].index = -9; // השלישי מחכה מאחורי הקלעים
  layout();
  await ytReady;
  makePlayer(slots[0]).then(() => playCurrent());
  makePlayer(slots[1]).then(s => load(s, !SAVE_DATA));
  makePlayer(slots[2]);
  addEventListener("resize", () => layout());

  document.addEventListener("visibilitychange", () => { const s = curSlot(); if (!s || !s.ready) return; try { if (document.hidden) s.p.pauseVideo(); else if (s.user !== "pause") s.p.playVideo(); } catch (e) {} });
})();
</script>
</body>
</html>
