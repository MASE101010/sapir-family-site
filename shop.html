  <link rel="stylesheet" href="assets/css/style.css?v=202611021859">
  <style>
    .shop-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    @media (max-width: 1000px) { .pgrid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px) { .pgrid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
    .pcard { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: transform 0.3s var(--ease), box-shadow 0.3s, border-color 0.3s; position: relative; }
    .pcard:hover { transform: translateY(-5px); border-color: var(--line-2); box-shadow: var(--shadow-glow); }
    .pimg { aspect-ratio: 1; background: #fff; display: grid; place-items: center; overflow: hidden; }
    .pimg img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s var(--ease); }
    .pcard:hover .pimg img { transform: scale(1.06); }
    .pimg .ph { font-size: 3rem; }
    .pbody { padding: 12px 14px 14px; display: grid; gap: 6px; flex: 1; }
    .pname { font-weight: 700; line-height: 1.35; font-size: 0.98rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pprice { font-family: var(--font-display); font-size: 1.3rem; color: var(--lemon); }
    .pprice s { font-family: var(--font-body); font-size: 0.85rem; color: var(--ink-soft); margin-inline-start: 6px; }
    .pbtn { margin-top: auto; }
    .pcard .sold { position: absolute; top: 10px; inset-inline-start: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; }
    .pcard .sale { position: absolute; top: 10px; inset-inline-end: 10px; background: #ffe14d; color: #0b0d2e; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 800; }
    .shop-frame { border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--line); background: #fff; box-shadow: var(--shadow-ink); height: min(82vh, 1100px); position: relative; }
    .shop-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .cats { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 22px; }
  </style>
</head>
<body data-page="shop">
<main id="main">
  <section class="container page-head">
    <div class="shop-head">
      <div>
        <h1 class="holo-title">החנות שלנו</h1>
        <p class="lead">בובת תולי, קולקציית הממלכה, משחקי הקופסה, הבשמים של אלין ואלרועי ועוד. בוחרים כאן, משלמים בחנות המאובטחת שלנו, והמשלוח אליכם הביתה.</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <a class="btn btn-ghost btn-sm" id="cart-link" href="https://www.merchadvice.com/cart/" target="_blank" rel="noopener">🛒 הסל שלי</a>
        <a class="btn btn-ghost btn-sm" id="ext-link" href="#" target="_blank" rel="noopener">לפתיחת החנות בחלון נפרד</a>
      </div>
    </div>
    <div class="cats" id="cats"></div>
  </section>

  <section class="container">
    <div class="pgrid" id="pgrid"></div>
    <div id="shop-frame-wrap" hidden>
      <div class="shop-frame"><iframe id="shop-frame" title="החנות של משפחת ספיר" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allow="payment"></iframe></div>
      <p class="muted" style="margin:12px 4px 0;font-size:.95rem">אם החנות לא נטענת כאן, <a id="ext-link2" href="#" target="_blank" rel="noopener">פתחו אותה בחלון נפרד</a>.</p>
    </div>
  </section>
</main>

<script src="assets/js/config.js?v=202611021859"></script>
<script src="assets/js/site.js?v=202611021859"></script>
<script>
(async () => {
  const S = window.SAPIR, ext = S.shopExternalUrl;
  document.getElementById("ext-link").href = ext; document.getElementById("ext-link2").href = ext;
  const grid = document.getElementById("pgrid"), wrap = document.getElementById("shop-frame-wrap");
  const CATS = [["הכול", /./], ["תולי", /תולי/], ["הממלכה", /הממלכה/], ["בובות", /בוב(ת|ות)/], ["חולצות וקפוצ'ונים", /חולצה|קפוצ|קפצ|אוברול|פיג'מה/], ["משחקים", /משחק|אתגר|גיטרה/], ["בשמים", /בושם/], ["מבצעים", /מבצע/]];
  const PH = ["🧸", "👕", "🎁", "🎲", "🧢", "🧴", "🦁", "👑"];
  const render = (products, f) => {
    const list = products.filter(p => f.test(p.name));
    grid.innerHTML = list.map((p, i) => `
      <a class="pcard" href="${p.link}" target="_blank" rel="noopener">
        ${p.soldOut ? '<span class="sold">אזל במלאי</span>' : ""}${p.oldPrice ? '<span class="sale">מבצע</span>' : ""}
        <div class="pimg">${p.img ? `<img src="${p.img}" alt="${p.name}" loading="lazy">` : `<span class="ph" aria-hidden="true">${PH[i % PH.length]}</span>`}</div>
        <div class="pbody"><div class="pname">${p.name}</div><div class="pprice">${p.price || ""}${p.oldPrice ? `<s>${p.oldPrice}</s>` : ""}</div><span class="btn btn-ink btn-sm pbtn">${p.soldOut ? "לפרטים" : "לרכישה"}</span></div>
      </a>`).join("");
  };
  const showCats = (products) => {
    const cats = document.getElementById("cats");
    cats.innerHTML = CATS.map(([n], i) => `<button class="tab" aria-pressed="${i === 0}">${n}</button>`).join("");
    cats.querySelectorAll(".tab").forEach((b, i) => b.addEventListener("click", () => { cats.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x === b)); render(products, CATS[i][1]); }));
  };
  try {
    // ניסיון 1: רשימת המוצרים החיה דרך /api/shop (עובד אחרי העלאה ל-Cloudflare)
    const r = await fetch("/api/shop", { cache: "no-store" });
    if (!r.ok) throw new Error("api");
    const d = await r.json();
    if (!d.products || d.products.length < 3) throw new Error("empty");
    showCats(d.products); render(d.products, /./);
  } catch (e) {
    try {
      // ניסיון 2: תמונת מצב שמורה של החנות (data/products.json)
      const r = await fetch("data/products.json", { cache: "no-store" });
      const d = await r.json();
      showCats(d.products); render(d.products, /./);
    } catch (e2) {
      // ניסיון 3: החנות עצמה בתוך האתר
      grid.hidden = true; wrap.hidden = false; document.getElementById("shop-frame").src = ext;
    }
  }
})();
</script>
</body>
</html>
