<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VOD | משפחת ספיר</title>
  <meta name="description" content="ה-VOD של משפחת ספיר: כל הוולוגים והסדרות, מסודרים לפי קטגוריות: הנצפים ביותר, טופ 10 החודש, קומדיה, אקשן, סדרות וחינוכי.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://i.ytimg.com">
  <meta name="theme-color" content="#070a22">
  <link rel="icon" href="assets/img/logo-small.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/SapirPop.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css?v=202611010019">
  <style>
    .ticker-wrap { display: none; }
    /* בילבורד: תמונת 16:9 שלמה, בלי חיתוך, בכל גודל מסך */
    .billboard { position: relative; overflow: hidden; background: #000; }
    .billboard .blur { position: absolute; inset: -8%; background: center / cover no-repeat; filter: blur(40px) brightness(0.5); transform: scale(1.1); }
    .bb-media { position: relative; width: min(100%, calc(72vh * 16 / 9)); margin: 0 auto; aspect-ratio: 16 / 9; overflow: hidden; }
    .bb-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.8s; }
    .bb-media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(7,10,34,0.95) 0%, rgba(7,10,34,0.55) 28%, transparent 55%); }
    .bb-play { position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.92); display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 40px rgba(0,0,0,0.6); transition: transform 0.25s var(--ease), background 0.2s; z-index: 2; }
    .bb-play:hover { transform: scale(1.08); background: #fff; }
    .bb-play svg { width: 36px; height: 36px; fill: #0b0d2e; margin-inline-start: -4px; }
    .bb-inner { position: relative; z-index: 1; padding: 0 0 10px; max-width: 680px; margin: -120px auto 0; width: min(100%, calc(72vh * 16 / 9)); }
    .bb-inner > .bb-text { padding: 0 24px 34px; }
    .bb-tag { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: #fff; background: var(--magenta); padding: 4px 14px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 12px; }
    .bb-title { font-size: clamp(1.6rem, 3.6vw, 3rem); line-height: 1.15; margin: 0 0 8px; text-shadow: 0 6px 30px rgba(0,0,0,0.8); }
    .bb-meta { color: var(--ink-2); display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; font-size: 0.95rem; }
    .bb-meta b { color: #7dffd6; }
    .bb-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .bb-actions .btn-ink { padding: 0.65em 1.4em; font-size: 1rem; }
    .bb-dots { display: flex; gap: 6px; justify-content: center; padding: 6px 0 14px; }
    .bb-dots i { width: 22px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.25); transition: background 0.3s; }
    .bb-dots i.on { background: #fff; }
    @media (max-width: 900px) {
      .bb-media { width: 100%; }
      .bb-media::after { background: linear-gradient(to top, rgba(7,10,34,0.75), transparent 40%); }
      .bb-inner { margin-top: 0; width: 100%; }
      .bb-inner > .bb-text { padding: 16px 18px 22px; }
      .bb-play { width: 64px; height: 64px; } .bb-play svg { width: 28px; height: 28px; }
    }
    /* שורות */
    .row { margin: 34px 0 0; position: relative; }
    .row h2 { font-size: clamp(1.25rem, 2.2vw, 1.7rem); margin: 0 0 12px; display: flex; align-items: baseline; gap: 12px; }
    .row h2 small { font-size: 0.8rem; color: var(--ink-soft); font-family: var(--font-body); font-weight: 600; }
    .track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 8px 2px 18px; scroll-behavior: smooth; }
    .track::-webkit-scrollbar { display: none; }
    .tile { flex: 0 0 clamp(200px, 22vw, 300px); scroll-snap-align: start; position: relative; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--line); cursor: pointer; transition: transform 0.35s var(--ease), box-shadow 0.35s, z-index 0s 0.2s; aspect-ratio: 16 / 9; text-align: right; padding: 0; color: #fff; font: inherit; }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s var(--ease); }
    .tile:hover, .tile:focus-visible { transform: scale(1.08); z-index: 3; box-shadow: 0 20px 50px -14px rgba(0,0,0,0.9), 0 0 0 2px rgba(255,255,255,0.35); }
    .tile:hover img { transform: scale(1.06); }
    .tile .cap { position: absolute; inset: auto 0 0; padding: 36px 12px 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); font-weight: 700; font-size: 0.92rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; opacity: 0; transition: opacity 0.3s; }
    .tile:hover .cap, .tile:focus-visible .cap { opacity: 1; }
    .tile .dur { position: absolute; bottom: 6px; inset-inline-end: 6px; background: rgba(0,0,0,0.65); padding: 1px 6px; border-radius: 5px; font-size: 0.68rem; line-height: 1.5; z-index: 2; }
    .tile .vw { position: absolute; bottom: 6px; inset-inline-start: 6px; background: rgba(0,0,0,0.65); padding: 1px 6px; border-radius: 5px; font-size: 0.68rem; line-height: 1.5; z-index: 2; }
    @media (max-width: 900px) {
      .tile { flex-basis: clamp(150px, 42vw, 220px); }
      .tile .dur, .tile .vw { font-size: 0.58rem; padding: 0 4px; bottom: 4px; }
      .tile .dur { inset-inline-end: 4px; } .tile .vw { inset-inline-start: 4px; }
      .tile .cap { opacity: 0; } /* בנייד התמונה נקייה; הכותרת מופיעה בנגן */
      .top10 .tile { flex-basis: clamp(170px, 46vw, 240px); margin-inline-start: 22px; }
      .top10 .num { font-size: 2.6rem; -webkit-text-stroke-width: 1.5px; inset-inline-start: calc(100% - 12px); bottom: -6px; }
      .row { margin-top: 22px; }
      .bb-actions { flex-wrap: nowrap; gap: 8px; }
      .bb-actions .btn { flex: 1 1 0; min-width: 0; padding: 0.7em 0.6em !important; font-size: 0.95rem !important; white-space: nowrap; justify-content: center; }
      .bb-title { font-size: 1.45rem; }
      .bb-meta { font-size: 0.85rem; gap: 10px; margin-bottom: 12px; }
      .bb-inner > .bb-text { padding: 12px 16px 16px; }
    }
    .row h2 { position: relative; z-index: 2; }
    .vod-tools { margin-top: 18px; }
    .vsearch { display: flex; align-items: center; gap: 10px; background: var(--glass); border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 16px; max-width: 560px; }
    .vsearch svg { width: 22px; height: 22px; fill: var(--ink-soft); flex: none; }
    .vsearch input { flex: 1; background: none; border: 0; color: #fff; font: inherit; font-size: 1rem; padding: 8px 0; outline: none; min-width: 0; }
    .vsearch input::placeholder { color: var(--ink-soft); }
    .vsearch:focus-within { border-color: #fff; }
    .vresults { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
    .vresults .tile { flex: none; width: 100%; }
    .vresults .cap { opacity: 1 !important; padding-bottom: 28px; }
    .vresults .none { grid-column: 1 / -1; color: var(--ink-soft); padding: 10px 0; }
    .row { scroll-margin-top: 90px; }
    .top10 .track { padding-top: 10px; padding-inline-start: 4px; }
    .tile .pl { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity 0.3s; }
    .tile:hover .pl { opacity: 1; }
    .tile .pl span { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.92); display: grid; place-items: center; }
    .tile .pl svg { width: 24px; height: 24px; fill: #0b0d2e; margin-inline-start: -3px; }
    /* טופ 10 */
    .top10 .tile { flex-basis: clamp(230px, 24vw, 330px); margin-inline-start: 30px; overflow: visible; border-radius: 12px; }
    .top10 .tile img { border-radius: 12px; }
    /* המספר: לבן עם קו מתאר שחור, קטן, יושב לפני התמונה (מימין) ומעליה */
    .top10 .num { position: absolute; inset-inline-start: calc(100% - 18px); bottom: -8px; font-family: var(--font-display); font-size: clamp(3rem, 4.5vw, 4.2rem); line-height: 0.85; color: #fff; -webkit-text-stroke: 2px #000; paint-order: stroke fill; text-shadow: 0 4px 14px rgba(0,0,0,0.6); z-index: 3; pointer-events: none; }
    .arrow { position: absolute; top: 50%; z-index: 4; width: 44px; height: 70px; border: 0; background: rgba(7,10,34,0.7); color: #fff; font-size: 1.6rem; backdrop-filter: blur(6px); display: grid; place-items: center; transform: translateY(-30%); opacity: 0; transition: opacity 0.3s; }
    .row:hover .arrow { opacity: 1; }
    .arrow.r { inset-inline-start: -10px; border-radius: 0 12px 12px 0; } .arrow.l { inset-inline-end: -10px; border-radius: 12px 0 0 12px; }
    @media (pointer: coarse) { .arrow { display: none; } }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 0; }
    .vod-empty { padding: 80px 0; text-align: center; }
  </style>
</head>
<body data-page="vod">
<main id="main">
  <section class="billboard" id="billboard"><div class="blur" id="bb-blur"></div><div class="bb-media"><img id="bb-img" alt="" fetchpriority="high"><button class="bb-play" id="bb-play" aria-label="נגן"></button></div><div class="bb-inner"><div class="bb-text" id="bb"></div><div class="bb-dots" id="bb-dots"></div></div></section>
  <section class="container vod-tools">
    <div class="vsearch"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg><input id="vq" type="search" placeholder="חיפוש בכל הסרטונים..." aria-label="חיפוש סרטונים" autocomplete="off"></div>
    <div class="vresults" id="vresults" hidden></div>
  </section>
  <section class="container" id="rows"></section>
  <section class="container" style="margin-top:50px"><div class="ad-slot ad-leaderboard" data-ad-slot="vod-bottom"><div>פרסומת<small>(מקום שמור לדוגמה)</small></div></div></section>
</main>
<script src="assets/js/config.js?v=202611010019"></script>
<script src="assets/js/site.js?v=202611010019"></script>
<script src="assets/js/library.js?v=202611010019"></script>
<script>
(async () => {
  const S = window.SAPIR, I = window.SAPIR_ICONS;
  const rowsEl = document.getElementById("rows"), bb = document.getElementById("bb");
  let videos = [];
  try { videos = await window.loadLibrary(); } catch (e) {}
  if (!videos.length) {
    document.getElementById("billboard").style.minHeight = "0";
    rowsEl.innerHTML = `<div class="vod-empty"><h2>ה-VOD נטען מיוטיוב אחרי ההעלאה לאוויר</h2><a class="btn btn-ink" href="videos.html">בינתיים, לערוצים</a></div>`;
    return;
  }
  const rows = window.buildRows(videos, S.channels);
  const chName = id => (S.channels.find(c => c.id === id) || {}).name || "";
  const tile = (v, n) => `
    <button class="tile" type="button" data-video="${v.id}" data-title="${v.title.replace(/"/g, "&quot;")}" aria-label="נגן: ${v.title.replace(/"/g, "&quot;")}">
      ${n ? `<span class="num" aria-hidden="true">${n}</span>` : ""}
      <img src="${v.thumb}" alt="" loading="${(v.__eager) ? "eager" : "lazy"}" decoding="async">
      ${v.duration ? `<span class="dur">${window.fmtDuration(v.duration)}</span>` : ""}
      ${v.views ? `<span class="vw">${window.fmtViews(v.views)}</span>` : ""}
      <span class="pl"><span>${I.play}</span></span>
      <span class="cap">${v.title}</span>
    </button>`;
  rows.forEach(r => r.items.slice(0, 7).forEach(v => { v.__eager = true; }));
  // המשך צפייה: הסרטונים האחרונים שנפתחו במכשיר הזה
  let seen = []; try { seen = JSON.parse(localStorage.getItem("sapir-seen") || "[]"); } catch (e) {}
  const seenItems = seen.map(id => videos.find(v => v.id === id)).filter(Boolean);
  if (seenItems.length >= 2) rows.splice(1, 0, { key: "seen", title: "המשך צפייה", items: seenItems });
  rowsEl.innerHTML = rows.map(r => `
    <div class="row ${r.kind === "top10" ? "top10" : ""}" data-row="${r.key}" id="${r.key}">
      <h2>${r.title}<small>${r.items.length} סרטונים</small></h2>
      <button class="arrow r" aria-label="הקודמים">‹</button><button class="arrow l" aria-label="הבאים">›</button>
      <div class="track">${r.items.map((v, i) => tile(v, r.kind === "top10" ? i + 1 : 0)).join("")}</div>
    </div>`).join("");
  rowsEl.querySelectorAll(".row").forEach(row => {
    const t = row.querySelector(".track");
    row.querySelector(".arrow.l").addEventListener("click", () => t.scrollBy({ left: -t.clientWidth * 0.9 }));
    row.querySelector(".arrow.r").addEventListener("click", () => t.scrollBy({ left: t.clientWidth * 0.9 }));
  });
  rowsEl.addEventListener("click", (e) => { const b = e.target.closest(".tile"); if (b) window.openVideo(b.dataset.video, b.dataset.title); });
  const openId = new URLSearchParams(location.search).get("v"); if (openId) { const v = videos.find(x => x.id === openId); window.openVideo(openId, v ? v.title : ""); }
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth" }), 300); }

  // חיפוש מיידי בכל הספרייה (כולל שורטס): לפי מילים בכותרת
  const vq = document.getElementById("vq"), vres = document.getElementById("vresults");
  const norm = t => (t || "").toLowerCase().replace(/[^\p{L}\p{N} ]/gu, " ");
  const all = videos.filter(v => !v.unknown);
  vq.addEventListener("input", () => {
    const q = norm(vq.value).trim();
    if (q.length < 2) { vres.hidden = true; rowsEl.hidden = false; document.getElementById("billboard").hidden = false; return; }
    const words = q.split(/\s+/);
    const hits = all.filter(v => { const t = norm(v.title); return words.every(w => t.includes(w)); }).sort((a, b) => b.views - a.views).slice(0, 48);
    vres.innerHTML = hits.length ? hits.map(v => tile(v, 0)).join("") : `<div class="none">לא מצאנו סרטון עם "${vq.value}". נסו מילה אחרת.</div>`;
    vres.hidden = false; rowsEl.hidden = true; document.getElementById("billboard").hidden = true;
  });
  vres.addEventListener("click", (e) => { const b = e.target.closest(".tile"); if (b) { const v = all.find(x => x.id === b.dataset.video); if (v && v.isShort) location.href = `shorts.html?v=${v.id}`; else window.openVideo(b.dataset.video, b.dataset.title); } });

  // בילבורד: מתחלף בין סרטוני הטופ 10, תמונה 16:9 שלמה
  const top = (rows.find(r => r.kind === "top10") || rows[0]).items.slice(0, 5);
  let bi = 0, bbTimer;
  const bbImg = document.getElementById("bb-img"), bbBlur = document.getElementById("bb-blur"), bbPlay = document.getElementById("bb-play"), bbDots = document.getElementById("bb-dots");
  bbPlay.innerHTML = I.play;
  bbDots.innerHTML = top.map((_, i) => `<i data-i="${i}"></i>`).join("");
  const showBB = () => {
    const v = top[bi];
    const hi = `https://i.ytimg.com/vi/${v.id}/maxresdefault.jpg`;
    const pre = new Image(); pre.onload = () => { bbImg.src = pre.naturalWidth > 200 ? hi : v.thumb; bbImg.style.opacity = 1; }; pre.onerror = () => { bbImg.src = v.thumb; bbImg.style.opacity = 1; }; pre.src = hi;
    bbBlur.style.backgroundImage = `url(${v.thumb})`;
    bbPlay.dataset.play = v.id; bbPlay.dataset.title = v.title;
    bb.innerHTML = `
      <span class="bb-tag">★ טופ 10 החודש, מקום ${bi + 1}</span>
      <h1 class="bb-title">${v.title}</h1>
      <div class="bb-meta"><span>${chName(v.channel)}</span>${v.views ? `<b>${window.fmtViews(v.views)}</b>` : ""}${v.duration ? `<span>${window.fmtDuration(v.duration)} דקות</span>` : ""}<span>${window.fmtDate(v.published.slice(0, 10))}</span></div>
      <div class="bb-actions"><button class="btn btn-ink" data-play="${v.id}" data-title="${v.title.replace(/"/g, "&quot;")}">${I.play} נגן עכשיו</button><a class="btn btn-ghost" href="#rows">לכל הקטגוריות</a></div>`;
    bbDots.querySelectorAll("i").forEach((d, i) => d.classList.toggle("on", i === bi));
  };
  const nextBB = (i) => { bi = (i === undefined ? bi + 1 : i) % top.length; bbImg.style.opacity = 0; setTimeout(showBB, 350); };
  showBB();
  document.getElementById("billboard").addEventListener("click", (e) => { const b = e.target.closest("[data-play]"); if (b) { window.openVideo(b.dataset.play, b.dataset.title); return; } const d = e.target.closest(".bb-dots i"); if (d) { clearInterval(bbTimer); nextBB(+d.dataset.i); } });
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) bbTimer = setInterval(() => nextBB(), 9000);
})();
</script>
</body>
</html>
