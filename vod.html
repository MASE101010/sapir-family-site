<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VOD | משפחת ספיר</title>
  <meta name="description" content="ה-VOD של משפחת ספיר: כל הוולוגים והסדרות, מסודרים לפי קטגוריות: הנצפים ביותר, טופ 10 החודש, קומדיה, אקשן, סדרות וחינוכי.">
  <link rel="icon" href="assets/img/logo-small.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/SapirPop.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .ticker-wrap { display: none; }
    /* בילבורד */
    .billboard { position: relative; min-height: min(78vh, 720px); display: flex; align-items: flex-end; overflow: hidden; margin-top: -1px; }
    .billboard .bg { position: absolute; inset: 0; background: center 30% / cover no-repeat; transform: scale(1.04); transition: opacity 0.8s; }
    .billboard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 0%, rgba(7,10,34,0.75) 30%, rgba(7,10,34,0.15) 60%, rgba(7,10,34,0.5) 100%), linear-gradient(to left, rgba(7,10,34,0.85) 0%, transparent 55%); }
    .bb-inner { position: relative; z-index: 1; padding: 40px 0 60px; max-width: 640px; }
    .bb-tag { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: #fff; background: var(--magenta); padding: 4px 14px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 14px; }
    .bb-title { font-size: clamp(1.8rem, 4.2vw, 3.4rem); line-height: 1.15; margin: 0 0 10px; text-shadow: 0 6px 30px rgba(0,0,0,0.8); }
    .bb-meta { color: var(--ink-2); display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .bb-meta b { color: #7dffd6; }
    .bb-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .bb-actions .btn-ink { padding: 0.8em 1.8em; font-size: 1.05rem; }
    /* שורות */
    .row { margin: 34px 0 0; position: relative; }
    .row h2 { font-size: clamp(1.25rem, 2.2vw, 1.7rem); margin: 0 0 12px; display: flex; align-items: baseline; gap: 12px; }
    .row h2 small { font-size: 0.8rem; color: var(--ink-soft); font-family: var(--font-body); font-weight: 600; }
    .track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 8px 2px 18px; scroll-behavior: smooth; }
    .track::-webkit-scrollbar { display: none; }
    .tile { flex: 0 0 clamp(200px, 22vw, 300px); scroll-snap-align: start; position: relative; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--line); cursor: pointer; transition: transform 0.35s var(--ease), box-shadow 0.35s, z-index 0s 0.2s; aspect-ratio: 16 / 9; text-align: right; padding: 0; color: #fff; font: inherit; }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s var(--ease); }
    .tile:hover, .tile:focus-visible { transform: scale(1.08); z-index: 3; box-shadow: 0 20px 50px -14px rgba(0,0,0,0.9), 0 0 0 2px rgba(255,255,255,0.35); }
    .tile:hover img { transform: scale(1.06); }
    .tile .cap { position: absolute; inset: auto 0 0; padding: 36px 12px 10px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); font-weight: 700; font-size: 0.92rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; opacity: 0; transition: opacity 0.3s; }
    .tile:hover .cap, .tile:focus-visible .cap { opacity: 1; }
    .tile .dur { position: absolute; top: 8px; inset-inline-start: 8px; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; }
    .tile .vw { position: absolute; top: 8px; inset-inline-end: 8px; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; }
    .tile .pl { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity 0.3s; }
    .tile:hover .pl { opacity: 1; }
    .tile .pl span { width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.92); display: grid; place-items: center; }
    .tile .pl svg { width: 24px; height: 24px; fill: #0b0d2e; margin-inline-start: -3px; }
    /* טופ 10 */
    .top10 .tile { flex-basis: clamp(230px, 24vw, 330px); margin-inline-start: 56px; overflow: visible; border-radius: 12px; }
    .top10 .tile img { border-radius: 12px; }
    .top10 .num { position: absolute; inset-inline-end: calc(100% - 26px); bottom: -14px; font-family: var(--font-display); font-size: clamp(6rem, 11vw, 9.5rem); line-height: 0.8; color: var(--bg); -webkit-text-stroke: 3px rgba(255,255,255,0.75); text-shadow: 0 0 30px rgba(123,92,255,0.5); z-index: -1; pointer-events: none; }
    .top10 .tile:hover .num { -webkit-text-stroke-color: var(--lemon); }
    .arrow { position: absolute; top: 50%; z-index: 4; width: 44px; height: 70px; border: 0; background: rgba(7,10,34,0.7); color: #fff; font-size: 1.6rem; backdrop-filter: blur(6px); display: grid; place-items: center; transform: translateY(-30%); opacity: 0; transition: opacity 0.3s; }
    .row:hover .arrow { opacity: 1; }
    .arrow.r { inset-inline-start: -10px; border-radius: 0 12px 12px 0; } .arrow.l { inset-inline-end: -10px; border-radius: 12px 0 0 12px; }
    @media (pointer: coarse) { .arrow { display: none; } .tile .cap { opacity: 1; } }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 0; }
    .vod-empty { padding: 80px 0; text-align: center; }
  </style>
</head>
<body data-page="vod">
<main id="main">
  <section class="billboard" id="billboard"><div class="bg" id="bb-bg"></div><div class="container bb-inner" id="bb"></div></section>
  <section class="container" id="rows"></section>
  <section class="container" style="margin-top:50px"><div class="ad-slot ad-leaderboard" data-ad-slot="vod-bottom"><div>פרסומת<small>(מקום שמור לדוגמה)</small></div></div></section>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/library.js"></script>
<script>
(async () => {
  const S = window.SAPIR, I = window.SAPIR_ICONS;
  const rowsEl = document.getElementById("rows"), bb = document.getElementById("bb");
  let videos = [];
  try { videos = await window.loadLibrary(); } catch (e) {}
  if (!videos.length) {
    document.getElementById("billboard").style.minHeight = "0";
    rowsEl.innerHTML = `<div class="vod-empty"><h2>ה-VOD נטען מיוטיוב אחרי ההעלאה לאוויר</h2><a class="btn btn-ink" href="videos.html">בינתיים, לערוצים</a></div>`;
    return;
  }
  const rows = window.buildRows(videos, S.channels);
  const chName = id => (S.channels.find(c => c.id === id) || {}).name || "";
  const tile = (v, n) => `
    <button class="tile" type="button" data-video="${v.id}" data-title="${v.title.replace(/"/g, "&quot;")}" aria-label="נגן: ${v.title.replace(/"/g, "&quot;")}">
      ${n ? `<span class="num" aria-hidden="true">${n}</span>` : ""}
      <img src="${v.thumb}" alt="" loading="lazy">
      ${v.duration ? `<span class="dur">${window.fmtDuration(v.duration)}</span>` : ""}
      ${v.views ? `<span class="vw">${window.fmtViews(v.views)}</span>` : ""}
      <span class="pl"><span>${I.play}</span></span>
      <span class="cap">${v.title}</span>
    </button>`;
  rowsEl.innerHTML = rows.map(r => `
    <div class="row ${r.kind === "top10" ? "top10" : ""}" data-row="${r.key}">
      <h2>${r.title}<small>${r.items.length} סרטונים</small></h2>
      <button class="arrow r" aria-label="הקודמים">‹</button><button class="arrow l" aria-label="הבאים">›</button>
      <div class="track">${r.items.map((v, i) => tile(v, r.kind === "top10" ? i + 1 : 0)).join("")}</div>
    </div>`).join("");
  rowsEl.querySelectorAll(".row").forEach(row => {
    const t = row.querySelector(".track");
    row.querySelector(".arrow.l").addEventListener("click", () => t.scrollBy({ left: -t.clientWidth * 0.9 }));
    row.querySelector(".arrow.r").addEventListener("click", () => t.scrollBy({ left: t.clientWidth * 0.9 }));
  });
  rowsEl.addEventListener("click", (e) => { const b = e.target.closest(".tile"); if (b) window.openVideo(b.dataset.video, b.dataset.title); });

  // בילבורד: מתחלף בין סרטוני הטופ 10
  const top = (rows.find(r => r.kind === "top10") || rows[0]).items.slice(0, 5);
  let bi = 0;
  const showBB = () => {
    const v = top[bi];
    document.getElementById("bb-bg").style.backgroundImage = `url(https://i.ytimg.com/vi/${v.id}/maxresdefault.jpg), url(${v.thumb})`;
    bb.innerHTML = `
      <span class="bb-tag">★ טופ 10 החודש, מקום ${bi + 1}</span>
      <h1 class="bb-title">${v.title}</h1>
      <div class="bb-meta"><span>${chName(v.channel)}</span>${v.views ? `<b>${window.fmtViews(v.views)}</b>` : ""}${v.duration ? `<span>${window.fmtDuration(v.duration)} דקות</span>` : ""}<span>${window.fmtDate(v.published.slice(0, 10))}</span></div>
      <div class="bb-actions"><button class="btn btn-ink" data-play="${v.id}" data-title="${v.title.replace(/"/g, "&quot;")}">${I.play} נגן עכשיו</button><a class="btn btn-ghost" href="#rows">לכל הקטגוריות</a></div>`;
  };
  showBB();
  bb.addEventListener("click", (e) => { const b = e.target.closest("[data-play]"); if (b) window.openVideo(b.dataset.play, b.dataset.title); });
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(() => { bi = (bi + 1) % top.length; const bg = document.getElementById("bb-bg"); bg.style.opacity = 0; setTimeout(() => { showBB(); bg.style.opacity = 1; }, 500); }, 9000);
})();
</script>
</body>
</html>
