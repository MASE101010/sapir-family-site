<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הסרטונים שלנו | משפחת ספיר</title>
  <meta name="description" content="כל הסרטונים של משפחת ספיר במקום אחד: SAPIRTV, משפחת ספיר, מיכאל, שירן, אלין ואלרועי. פלייליסטים מיוטיוב שמתעדכנים לבד.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://i.ytimg.com">
  <meta name="theme-color" content="#070a22">
  <link rel="icon" href="assets/img/logo-small.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/SapirPop.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css?v=202610311905">
  <style>
    .channel-head { display: flex; align-items: center; gap: 16px; margin: 0 0 16px; }
    .channel-head .avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.6rem; color: #fff; flex: none; overflow: hidden; box-shadow: 0 0 24px -4px currentColor; }
    .channel-head .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .channel-head h2 { margin: 0; font-size: 1.8rem; }
    .channel-head p { margin: 0; color: var(--ink-soft); }
    .channel-head .btn { margin-inline-start: auto; }
    .channel-block { scroll-margin-top: 90px; margin-top: 44px; }
    @media (max-width: 640px) { .channel-head { flex-wrap: wrap; } .channel-head .btn { margin-inline-start: 0; } }
  </style>
</head>
<body data-page="videos">
<main id="main">
  <section class="container page-head">
    <h1 class="holo-title">הסרטונים שלנו</h1>
    <p class="lead">שבעה ערוצים, אלפי סרטונים. הנגנים כאן מחוברים ישירות לערוצים ביוטיוב, אז כל סרטון שעולה שם מופיע גם כאן, אוטומטית.</p>
    <div class="tabs" id="tabs" role="tablist" aria-label="בחירת ערוץ"></div>
  </section>

  <section class="container" style="margin-bottom:40px">
    <div class="section-head"><div><h2 class="holo-title" style="font-size:1.9rem">שורטס חמים</h2></div><a class="btn btn-ghost" href="shorts.html">לכל השורטס</a></div>
    <div class="shorts-row" id="shorts"></div>
  </section>

  <section class="container with-side">
    <div id="channels"></div>
    <aside class="side-sticky">
      <div class="card" style="padding:22px">
        <h3 style="font-family:var(--font-body);font-weight:800;font-size:1.2rem">הירשמו לערוצים</h3>
        <p class="muted" style="font-size:.95rem">כל ערוץ הוא עולם אחר. לחצו על הפעמון כדי לא לפספס פרק חדש.</p>
        <div id="side-links" style="display:grid;gap:8px"></div>
      </div>
      <div class="ad-slot ad-rect" data-ad-slot="videos-side"><div>פרסומת<small>(מקום שמור לדוגמה)</small></div></div>
    </aside>
  </section>
</main>

<script src="assets/js/config.js?v=202610311905"></script>
<script src="assets/js/site.js?v=202610311905"></script>
<script src="assets/js/library.js?v=202610311905"></script>
<script>
(async () => {
  const S = window.SAPIR, I = window.SAPIR_ICONS;
  // הספרייה המלאה (סרטונים ושורטס מסווגים, כותרות בעברית); גיבוי ל-RSS של כל ערוץ
  let lib = null; try { lib = await window.loadLibrary(); } catch (e) {}
  const shortsEl = document.getElementById("shorts");
  if (lib) shortsEl.innerHTML = window.shortsOf(lib).slice(0, 6).map(v => window.videoCard(v, "vshort")).join("");
  else { const shortsCh = S.channels.find(c => c.id === "sapirtv"); window.fetchChannelVideos(window.channelIdOf(shortsCh)).then(vs => { shortsEl.innerHTML = vs.slice(0, 6).map(v => window.videoCard(v, "vshort")).join(""); }).catch(() => { shortsEl.closest("section").hidden = true; }); }
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = S.channels.map((c, i) => `<a class="tab" role="tab" href="#${c.id}">${c.name}</a>`).join("");
  document.getElementById("channels").innerHTML = S.channels.map(c => `
    <section class="channel-block" id="${c.id}">
      <div class="channel-head">
        <div class="avatar" style="background:${c.color};color:${c.color}">${c.avatar ? `<img src="${c.avatar}" alt="">` : c.initial}</div>
        <div><h2>${c.name}</h2><p>${c.who}${c.subs ? `, ${c.subs} מנויים` : ""}</p></div>
        <a class="btn btn-ghost btn-sm" href="${c.url}" target="_blank" rel="noopener">${I.youtube} להרשמה לערוץ</a>
      </div>
      <div class="vgrid" id="vg-${c.id}"><div class="video-frame" style="grid-column:1/-1"><div class="video-placeholder"><div><div class="play">${I.play}</div><strong>${c.name}</strong><small>טוען את הסרטונים האחרונים...</small></div></div></div></div>
      <div class="card-foot" style="margin-top:14px"><a class="btn btn-ghost btn-sm" href="${c.url}/videos" target="_blank" rel="noopener">לכל הסרטונים של ${c.name} ביוטיוב</a></div>
    </section>`).join("");
  // טעינת הסרטונים מה-RSS של כל ערוץ, וגיבוי לפלייליסט ההעלאות אם ה-API לא זמין
  S.channels.forEach(c => {
    const box = document.getElementById("vg-" + c.id);
    const fromLib = lib ? lib.filter(v => v.channel === c.id && !v.isShort).slice(0, 9) : [];
    (fromLib.length ? Promise.resolve(fromLib) : window.fetchChannelVideos(window.channelIdOf(c)).then(vs => vs.filter(v => !/#shorts/i.test(v.title)))).then(vs => {
      box.innerHTML = vs.slice(0, 9).map(v => window.videoCard(v)).join("");
    }).catch(() => {
      box.innerHTML = `<div class="video-frame" style="grid-column:1/-1">${c.playlistId
        ? `<iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=${c.playlistId}" title="הסרטונים של ${c.name}" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`
        : `<div class="video-placeholder"><div><div class="play">${I.play}</div><strong>${c.name}</strong></div></div>`}</div>`;
    });
  });
  document.getElementById("side-links").innerHTML = S.channels.map(c =>
    `<a class="btn btn-ghost btn-sm" style="justify-content:flex-start" href="${c.url}" target="_blank" rel="noopener"><img src="${c.avatar}" alt="" style="width:22px;height:22px;border-radius:50%">${c.name}</a>`).join("");

  const setActive = () => {
    const h = location.hash || "#" + S.channels[0].id;
    tabs.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.getAttribute("href") === h));
  };
  setActive();
  addEventListener("hashchange", setActive);
})();
</script>
</body>
</html>
